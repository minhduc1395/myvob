<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Từ vựng — học theo lịch nhớ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Từ vựng">
<meta name="theme-color" content="#eef2ff">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23eef2ff'/%3E%3Cstop offset='.6' stop-color='%23fdf2f8'/%3E%3Cstop offset='1' stop-color='%23eafff3'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='180' height='180' fill='url(%23g)'/%3E%3Ccircle cx='52' cy='56' r='34' fill='%236ea8fe' opacity='.55'/%3E%3Ccircle cx='132' cy='128' r='40' fill='%23a78bfa' opacity='.5'/%3E%3Ctext x='90' y='116' font-size='84' font-weight='700' text-anchor='middle' font-family='-apple-system,SF Pro Display,sans-serif' fill='%231c1c2e'%3ET%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c1c2e; --accent:#0a84ff; --accent-hi:#0071e3; --danger:#ff3b30;
  --ok:#065f46; --ok-bg:rgba(16,185,129,.2); --ok-br:#6ee7b7;
  --warn:#92400e; --warn-bg:rgba(245,158,11,.2); --warn-br:#fcd34d;
  --bad:#881337; --bad-bg:rgba(244,63,94,.2); --bad-br:#fda4af;
  --spring:cubic-bezier(.34,1.56,.64,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{
  margin:0;min-height:100%;color:var(--ink);background-color:#f2f2f7;
  background-image:
    radial-gradient(at 12% 18%, rgba(110,168,254,.55) 0, transparent 52%),
    radial-gradient(at 88% 12%, rgba(251,123,162,.42) 0, transparent 48%),
    radial-gradient(at 78% 82%, rgba(167,139,250,.48) 0, transparent 55%),
    radial-gradient(at 15% 85%, rgba(52,211,153,.35) 0, transparent 52%),
    linear-gradient(160deg,#eef2ff,#fdf2f8 60%,#eafff3);
  background-attachment:fixed;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Plus Jakarta Sans',system-ui,sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;
}
#app{max-width:620px;margin:0 auto;padding:22px 16px 72px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em;line-height:1.2}
h1{font-size:1.4rem;text-transform:uppercase;letter-spacing:.03em}
h2{font-size:1.15rem} h3{font-size:1rem;text-transform:uppercase;letter-spacing:.05em}
p{margin:.5em 0}
a{color:var(--accent);text-decoration:none;font-weight:600}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* --- bề mặt kính --- */
.card{
  position:relative;overflow:hidden;border-radius:24px;padding:20px;margin-bottom:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.14));
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
  border:1px solid rgba(255,255,255,.55);
  box-shadow:0 14px 34px rgba(31,38,80,.16), inset 0 1px 0 rgba(255,255,255,.7);
}
.card::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 38%);
  mix-blend-mode:overlay;
}
.card>*{position:relative}

/* --- nút --- */
button{
  font:inherit;font-weight:600;cursor:pointer;color:var(--ink);
  border-radius:9999px;padding:11px 18px;
  background:rgba(255,255,255,.32);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.55);
  box-shadow:0 2px 6px rgba(0,0,0,.04);
  transition:all .15s ease;
}
button:hover{background:rgba(255,255,255,.45);border-color:rgba(255,255,255,.7);transform:translateY(-1px)}
button:active{transform:scale(.96)}
button.primary{
  color:#0a5bb8;border:1px solid rgba(10,132,255,.45);
  background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(10,132,255,.22));
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  box-shadow:0 8px 20px rgba(10,132,255,.22), inset 0 1px 0 rgba(255,255,255,.9);
  transition:transform .15s var(--spring),filter .15s ease,background .15s ease;
}
button.primary:hover{background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(10,132,255,.3));transform:translateY(-1px)}
button.ghost{background:transparent;border-color:transparent;box-shadow:none;color:rgba(28,28,46,.5);padding:9px 12px}
button.ghost:hover{background:rgba(255,255,255,.35);transform:none}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #007aff;outline-offset:2px}

/* --- nhập liệu --- */
label{
  display:block;margin:16px 0 6px;font-size:11.5px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:rgba(28,28,46,.45);
}
input,textarea{
  font:inherit;font-weight:500;width:100%;padding:12px 14px;color:var(--ink);
  background:rgba(255,255,255,.32);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.55);border-radius:12px;transition:all .2s ease;
}
input:focus,textarea:focus{
  background:rgba(255,255,255,.45);border-color:rgba(10,132,255,.55);
  box-shadow:0 0 0 3px rgba(10,132,255,.22);outline:none;
}
textarea{min-height:92px;resize:vertical}
input::placeholder{color:rgba(28,28,46,.45)}

.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 0;min-width:0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.muted{color:rgba(28,28,46,.5);font-size:12px;font-weight:500}

/* --- bộ thẻ ở trang chủ --- */
.deck{
  display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;
  text-align:left;padding:20px;margin-bottom:12px;border-radius:24px;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.14));
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
  border:1px solid rgba(255,255,255,.55);
  box-shadow:0 14px 34px rgba(31,38,80,.16), inset 0 1px 0 rgba(255,255,255,.7);
  transition:all .32s var(--spring);
}
.deck:hover{transform:translateY(-2px);box-shadow:0 18px 40px rgba(31,38,80,.2)}
.deck .num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:2rem;font-weight:700;color:var(--accent)}
.deck .num.zero{color:rgba(28,28,46,.25)}

/* --- thẻ học --- */
.word{font-size:2rem;font-weight:700;letter-spacing:-.02em;line-height:1.15;word-break:break-word}
.meaning{font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
.context{
  font-size:.95rem;font-weight:500;color:rgba(28,28,46,.8);line-height:1.6;margin:16px 0;
  padding:14px 16px;border-radius:16px;
  background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.7);
}
.context b{font-weight:800;color:var(--ink);background:rgba(245,158,11,.25);border-radius:4px;padding:0 3px}
.blank{color:var(--accent);font-weight:800;letter-spacing:.08em}
.choice{
  display:block;width:100%;text-align:left;margin-bottom:9px;border-radius:16px;
  font-size:.95rem;font-weight:600;padding:14px 16px;
}
.choice.right{background:var(--ok-bg);border-color:var(--ok-br);color:var(--ok)}
.choice.wrong{background:var(--bad-bg);border-color:var(--bad-br);color:var(--bad)}
.verdict{font-weight:700;margin:14px 0 4px;font-size:.95rem}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}

/* --- đánh giá --- */
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}
.rate button{padding:10px 2px;font-size:12px;font-weight:700;line-height:1.3;border-radius:9999px}
.rate button b{display:block;font-size:10px;font-weight:500;color:rgba(28,28,46,.45)}
.rate button.primary b{color:rgba(10,91,184,.6)}
.auto{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:nowrap;
  margin-top:18px;padding:12px 14px;border-radius:16px;
  background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.8);
}
.auto>span{flex:1 1 auto;min-width:0;overflow-wrap:break-word}   /* chữ tự xuống dòng */
.auto>button{flex:0 0 auto;margin-left:auto;white-space:nowrap}  /* nút luôn nằm bên phải */
.auto .label{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(28,28,46,.45)}
.auto .value{font-size:1rem;font-weight:800}

.pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.pill{
  font-size:11px;font-weight:700;border-radius:9999px;padding:4px 11px;
  background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.95);
  box-shadow:0 2px 6px rgba(0,0,0,.03);color:rgba(28,28,46,.75);
}
.pill.warn{background:var(--warn-bg);border-color:var(--warn-br);color:var(--warn)}
.pill.accent{background:rgba(10,132,255,.15);border-color:rgba(10,132,255,.3);color:var(--accent-hi)}
.progress{
  height:6px;border-radius:9999px;overflow:hidden;margin-bottom:16px;
  background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.8);
}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s var(--spring)}
table{width:100%;border-collapse:collapse;font-size:13px;font-weight:500}
td{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.6)}
td:first-child{color:rgba(28,28,46,.6)}
td:last-child{text-align:right;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:9;max-width:90vw;
  padding:11px 18px;border-radius:9999px;font-size:13px;font-weight:600;color:var(--ink);
  background:rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(28px) saturate(200%);backdrop-filter:blur(28px) saturate(200%);
  border:1px solid rgba(255,255,255,.95);
  box-shadow:0 12px 36px rgba(15,23,42,.18), inset 0 1.5px 1.5px rgba(255,255,255,1);
}
.hide{display:none}

/* --- truyện ngắn --- */
.story h2{margin-bottom:6px}
.story .body p{font-size:1.06rem;font-weight:500;line-height:1.8;margin:0 0 14px;color:var(--ink)}
.story .tr p{font-size:.95rem;line-height:1.7;color:rgba(28,28,46,.75);margin:0 0 10px}
button.tw{
  all:unset;cursor:pointer;font-weight:800;color:var(--ink);border-radius:5px;padding:0 3px;
  background:rgba(245,158,11,.25);box-shadow:inset 0 -2px 0 rgba(245,158,11,.55);transition:background .15s ease;
}
button.tw:hover,button.tw.on{background:rgba(10,132,255,.18);box-shadow:inset 0 -2px 0 rgba(10,132,255,.55)}
button.tw:focus-visible{outline:2px solid #007aff;outline-offset:1px}
.gloss{
  margin-top:6px;padding:12px 14px;border-radius:16px;min-height:48px;font-size:14px;font-weight:500;
  background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.8);color:rgba(28,28,46,.8)
}
.gloss b{font-weight:800;color:var(--ink)}
.q{margin:16px 0 4px;font-weight:700}

/* --- màn hình đáp án: ví dụ và phần "Tìm hiểu thêm" --- */
.exs{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.ex{padding-left:12px;border-left:3px solid rgba(10,132,255,.3)}
.ex-en{font-size:14.5px;font-weight:500;line-height:1.55;color:var(--ink)}
.ex-en b{font-weight:800}
.ex-vi{margin-top:2px;font-size:13px;line-height:1.5;color:rgba(28,28,46,.55)}
details.more{margin-top:16px;border-radius:16px;background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.75)}
details.more>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;
  padding:11px 14px;font-size:12px;font-weight:600;color:rgba(28,28,46,.55);border-radius:16px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:'▾';font-size:11px}
details.more[open]>summary::after{content:'▴'}
details.more>summary:focus-visible{outline:2px solid #007aff;outline-offset:2px}
.more .sec{padding:12px 14px;border-top:1px solid rgba(255,255,255,.8)}
.sec-t{font-size:12px;font-weight:700;color:rgba(28,28,46,.5);margin-bottom:6px}
.use p{margin:0 0 6px;font-size:13.5px;line-height:1.65;font-weight:500;color:rgba(28,28,46,.68)}
.use p:first-child{color:var(--ink)}
.use p:last-child{margin-bottom:0}
.syn{display:grid;grid-template-columns:max-content 1fr;gap:5px 12px;font-size:13.5px;line-height:1.5;align-items:baseline}
.syn b{font-weight:700}
.syn span{color:rgba(28,28,46,.58)}
.fam{display:flex;flex-wrap:wrap;gap:6px}
.fam .pill i{font-style:normal;font-weight:500;color:rgba(28,28,46,.45);margin-left:4px}
.mn{margin:0;padding:10px 12px;border-radius:12px;font-size:13.5px;line-height:1.6;font-weight:500;color:rgba(28,28,46,.8);
  background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.22)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:11.5px;font-weight:500;color:rgba(28,28,46,.45)}
.meta button.ghost{padding:4px 10px;font-size:12px}
.src{margin:8px 0 0;font-size:12px;color:rgba(28,28,46,.5);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src a{font-weight:500;font-size:12px}

/* --- chấm nhiều câu cùng lúc / nhật ký --- */
.diary-r{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.7)}
.vt{margin-top:10px;border-radius:14px;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.8)}
.vt-i{padding:10px 12px;border-top:1px solid rgba(255,255,255,.8);font-size:13.5px;line-height:1.55}
.vt-i:first-child{border-top:0}
.vt-i p{margin:4px 0 0;color:rgba(28,28,46,.7);font-weight:500}
.vt-vi{padding:0 6px;border-radius:6px;background:rgba(245,158,11,.18);font-weight:600}
.vt-i .vt-ex{color:var(--ink);font-style:italic}

/* --- luyện thêm --- */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button.act{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;border-radius:18px}
button.act b{font-size:14px;font-weight:700}
button.act span{font-size:11.5px;font-weight:500;color:rgba(28,28,46,.55);line-height:1.35}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.match .col{display:flex;flex-direction:column;gap:8px}
button.mt{text-align:left;border-radius:14px;padding:12px;font-size:14px;font-weight:600;overflow-wrap:anywhere}
button.mt.on{background:rgba(10,132,255,.18);border-color:rgba(10,132,255,.5)}
button.mt.right{background:var(--ok-bg);border-color:var(--ok-br);color:var(--ok);opacity:.75}
button.mt.wrong{background:var(--bad-bg);border-color:var(--bad-br);color:var(--bad)}
.passage p{line-height:2.3;font-size:1.02rem;font-weight:500;margin:0 0 12px}
input.blank-in{display:inline-block;width:auto;min-width:5ch;padding:2px 8px;margin:0 2px;border-radius:8px;font-weight:700;text-align:center;font-size:.95rem}
input.blank-in.right{background:var(--ok-bg);border-color:var(--ok-br)}
input.blank-in.near{background:var(--warn-bg);border-color:var(--warn-br)}
input.blank-in.wrong{background:var(--bad-bg);border-color:var(--bad-br)}
.fix{font-weight:800;color:var(--ok);margin:0 4px}
button.chip{padding:4px 12px;font-size:13px;border-radius:9999px}
mark.err{background:rgba(244,63,94,.2);color:#881337;border-radius:5px;padding:0 3px;font-weight:700}

/* --- phím tắt --- */
.k,.kbdhint{display:none}
@media (hover:hover) and (pointer:fine){
  .k{display:inline-block;min-width:22px;text-align:center;margin-right:10px;padding:1px 6px;border-radius:9999px;
     font-size:11px;font-weight:700;color:rgba(28,28,46,.55);background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.95)}
  .kbdhint{display:block;margin-top:12px}
}

/* --- thống kê --- */
.bar>span{display:flex;gap:4px}
.seg{display:flex;gap:4px;padding:4px;border-radius:9999px;margin-bottom:14px;
  background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.7)}
.seg button{flex:1;padding:8px 6px;font-size:13px;border-color:transparent;background:transparent;box-shadow:none}
.seg button.on{background:rgba(255,255,255,.95);border-color:rgba(255,255,255,.95);color:var(--accent-hi);
  box-shadow:0 4px 16px rgba(0,0,0,.08), inset 0 1px 1px #fff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{position:relative;overflow:hidden;border-radius:20px;padding:14px 16px;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.14));
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
  border:1px solid rgba(255,255,255,.55);box-shadow:0 14px 34px rgba(31,38,80,.16), inset 0 1px 0 rgba(255,255,255,.7)}
.tile .v{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.7rem;font-weight:700;line-height:1.1}
.tile .t{margin-top:6px;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(28,28,46,.45)}
.tile .s{font-size:11px;font-weight:500;color:rgba(28,28,46,.5)}
.bars{display:flex;align-items:flex-end;gap:5px;height:140px;margin-top:12px}
.bars .col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.bars i{display:block;width:100%;border-radius:8px 8px 4px 4px;border:1px solid rgba(10,132,255,.35);
  background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(10,132,255,.4))}
.bars i{display:flex;flex-direction:column;overflow:hidden}
.bars i em{display:block;width:100%;background:rgba(167,139,250,.6)}
.bars i.hl{background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(10,132,255,.8))}
.bars .v{height:12px;font-size:10px;font-weight:700;color:rgba(28,28,46,.6);font-family:ui-monospace,Menlo,monospace}
.bars .l{font-size:10px;font-weight:600;color:rgba(28,28,46,.45);white-space:nowrap}
.hrow{display:grid;grid-template-columns:56px 1fr 44px;align-items:center;gap:10px;margin:10px 0;font-size:13px;font-weight:600}
.hrow .track{height:10px;border-radius:9999px;overflow:hidden;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8)}
.hrow .track i{display:block;height:100%;border-radius:9999px}

<body>
<div id="app"></div>
<script>
/* ============================ CẤU HÌNH & TIỆN ÍCH ============================ */
const APP_VERSION = '2026.10.05-14';   // tăng mỗi lần cập nhật để app tự nhận bản mới
const LS = {
  cfg: 'vocab.cfg', queue: 'vocab.queue', stats: 'vocab.dailyStats'
};
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nowISO = () => new Date().toISOString();
const days = (a, b) => (new Date(a) - new Date(b)) / 864e5;
const round = (n, d) => Math.round(n * 10 ** d) / 10 ** d;
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

const cfg = Object.assign({ apiUrl: '', token: '', geminiKey: '' },
  JSON.parse(localStorage.getItem(LS.cfg) || '{}'));
const saveCfg = () => localStorage.setItem(LS.cfg, JSON.stringify(cfg));

let DB = { raw: [], progress: {}, enrichment: {}, settings: {}, usage: null };
let session = null;

/* Chống bấm trùng: sau mỗi lần vẽ màn hình mới, bỏ qua các cú bấm trong 450ms đầu
   (nút mới vừa mọc ra ngay dưới ngón tay), và khóa lại khi đang xử lý một hành động. */
let busy = false, guardUntil = 0, renderAt = 0;
function arm(ms = 450) { guardUntil = Date.now() + ms; }
function once(fn) {
  return async (...args) => {
    if (busy || Date.now() < guardUntil) return;
    busy = true;
    try { await fn(...args); } finally { busy = false; }
  };
}

function toast(msg, ms = 2200) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}

/* ============================ FSRS 4.5 ============================ */
// Mô hình DSR: D (độ khó 1-10), S (độ bền, ngày), R (khả năng nhớ lúc này).
const W = [0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,
           1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];
const F = 19 / 81, C = -0.5;

const retrievability = (elapsedDays, S) => Math.pow(1 + F * Math.max(0, elapsedDays) / S, C);
const intervalFor = (S, r) => (S / F) * (Math.pow(r, 1 / C) - 1);
const initS = g => W[g - 1];
const initD = g => clamp(W[4] - Math.exp(W[5] * (g - 1)) + 1, 1, 10);

function nextD(D, g) {
  const d = D - W[6] * (g - 3);
  return clamp(W[7] * initD(4) + (1 - W[7]) * d, 1, 10);
}
function stabilityRecall(D, S, R, g) {
  const hard = g === 2 ? W[15] : 1, easy = g === 4 ? W[16] : 1;
  return S * (1 + Math.exp(W[8]) * (11 - D) * Math.pow(S, -W[9]) *
    (Math.exp(W[10] * (1 - R)) - 1) * hard * easy);
}
function stabilityForget(D, S, R) {
  return Math.min(S, W[11] * Math.pow(D, -W[12]) * (Math.pow(S + 1, W[13]) - 1) * Math.exp(W[14] * (1 - R)));
}

// Trả về card mới sau khi chấm. g: 1 Again, 2 Hard, 3 Good, 4 Easy.
// Các bước học ngắn (phút), ví dụ '1m,10m' → [1, 10]
function learningSteps() {
  const s = String(DB.settings.learning_steps || '1m,10m').split(',')
    .map(x => parseFloat(x) * (x.includes('h') ? 60 : 1)).filter(x => x > 0);
  return s.length ? s : [1, 10];
}
function schedule(card, g) {
  const r = Number(DB.settings.target_retention) || 0.9;
  const steps = learningSteps();
  const c = { ...card };
  const t = new Date();
  const minutes = m => new Date(t.getTime() + m * 60000).toISOString();
  const after = d => new Date(t.getTime() + Math.max(1, Math.round(d)) * 864e5).toISOString();

  if (c.state === 'new') {
    c.S = initS(g); c.D = initD(g); c.reps = 1;
    if (g === 1) { c.state = 'learning'; c.step = 0; c.due = minutes(steps[0]); }
    else if (g === 2) { c.state = 'learning'; c.step = 0; c.due = minutes(steps[0]); }
    else if (g === 3) { c.state = 'learning'; c.step = 1; c.due = minutes(steps[1] ?? 10); }
    else { c.state = 'review'; c.due = after(intervalFor(c.S, r)); }
  } else if (c.state === 'learning' || c.state === 'relearning') {
    c.reps++;
    if (g === 1) { c.step = 0; c.due = minutes(steps[0]); }
    else if (g === 2) { c.due = minutes(steps[0]); }
    else {
      const last = c.step >= steps.length - 1 || g === 4;
      if (last) { c.state = 'review'; c.due = after(intervalFor(c.S, r)); }
      else { c.step++; c.due = minutes(steps[c.step]); }
    }
  } else { // review
    const elapsed = c.last_review ? days(t, c.last_review) : 0;
    const R = retrievability(elapsed, c.S);
    c.reps++;
    c.D = nextD(c.D, g);
    if (g === 1) {
      c.lapses++; c.S = stabilityForget(c.D, c.S, R);
      c.state = 'relearning'; c.step = 0; c.due = minutes(steps[0]);
    } else {
      c.S = stabilityRecall(c.D, c.S, R, g);
      c.due = after(intervalFor(c.S, r));
    }
  }
  c.last_review = nowISO();
  c.stage = g === 1 ? Math.max(0, (c.stage ?? 0) - 1) : (g >= 3 ? Math.min(3, (c.stage ?? 0) + 1) : (c.stage ?? 0));
  c.updated_at = nowISO();
  return c;
}

/* ============================ ĐỒNG BỘ VỚI GOOGLE SHEET ============================ */
function queueRead() { try { return JSON.parse(localStorage.getItem(LS.queue) || '[]'); } catch { return []; } }
function queueWrite(q) { localStorage.setItem(LS.queue, JSON.stringify(q)); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const upsertKey = x => x.action === 'saveSettings' ? x.row.key : x.row.word_id;

function enqueue(action, row) {
  let q = queueRead();
  // Lệnh cập nhật (upsert) chỉ cần bản mới nhất của mỗi từ: gộp để hàng đợi không phình ra.
  if (action.startsWith('upsert') || action === 'saveSettings') {
    const k = upsertKey({ action, row });
    q = q.filter(x => !(x.action === action && upsertKey(x) === k));
  }
  q.push({ id: uid(), action, row, tries: 0 });
  queueWrite(q);
}
// Hàng đợi cũ (bản trước) chưa có id: gán id một lần khi khởi động.
function migrateQueue() {
  const q = queueRead();
  if (q.some(x => !x.id)) queueWrite(q.map(x => ({ id: x.id || uid(), tries: x.tries || 0, ...x })));
}

const DEAD = 'vocab.dead';
const deadCount = () => { try { return JSON.parse(localStorage.getItem(DEAD) || '[]').length; } catch { return 0; } }

// Gửi MỘT nhóm lệnh. Chỉ coi là xong khi server trả { ok: true }.
// Gửi lại thì an toàn: server bỏ qua dòng đã có (ReviewLog/ApiUsage) và không cho bản cũ ghi đè bản mới.
async function sendGroup(action, rows) {
  try {
    const res = await fetch(cfg.apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: cfg.token, action, rows })
    });
    const out = await res.json();
    return !!(out && out.ok === true);
  } catch { return false; }
}

let flushing = false, failCount = 0, nextTry = 0;
async function flush(force = false) {
  if (flushing || Date.now() < nextTry) return;
  if (!queueRead().length || (!force && queueRead().length < 5)) return;
  const run = async () => {
    flushing = true;
    try {
      const batch = queueRead();
      const groups = {};
      batch.forEach(x => (groups[x.action] ||= []).push(x));
      let allOk = true;
      for (const [action, items] of Object.entries(groups)) {
        for (let i = 0; i < items.length; i += 100) {            // chia lô tối đa 100 dòng
          const part = items.slice(i, i + 100), ids = new Set(part.map(x => x.id));
          if (await sendGroup(action, part.map(x => x.row))) {
            queueWrite(queueRead().filter(x => !ids.has(x.id)));  // xóa đúng những dòng đã gửi xong
          } else {
            allOk = false;
            // Quá 8 lần vẫn lỗi thì tách ra khỏi hàng đợi, để không gửi lặp mãi.
            const q = queueRead(), dead = [];
            q.forEach(x => { if (ids.has(x.id)) x.tries = (x.tries || 0) + 1; });
            const live = q.filter(x => { const d = ids.has(x.id) && x.tries >= 8; if (d) dead.push(x); return !d; });
            queueWrite(live);
            if (dead.length) localStorage.setItem(DEAD, JSON.stringify([...JSON.parse(localStorage.getItem(DEAD) || '[]'), ...dead].slice(-200)));
            break;                                               // nhóm này lỗi thì thôi, thử nhóm khác
          }
        }
      }
      if (allOk) failCount = 0;
      else { failCount++; nextTry = Date.now() + Math.min(300000, 8000 * 2 ** failCount); } // lùi dần: 16s, 32s… tối đa 5 phút
    } finally {
      flushing = false;
      updateSyncBadge();
    }
  };
  // Nhiều tab cùng mở: chỉ một tab được gửi tại một thời điểm.
  if (navigator.locks && navigator.locks.request) {
    await navigator.locks.request('vocab-flush', { ifAvailable: true }, async lock => { if (lock) await run(); });
  } else await run();
}

// Gửi nền đều đặn, không chặn thao tác học.
setInterval(() => { if (navigator.onLine !== false) flush(true); }, 8000);
window.addEventListener('online', () => { nextTry = 0; flush(true); });

// Hiện số thay đổi còn chờ, nếu màn hình đang có chỗ để hiện.
function updateSyncBadge() {
  const el = document.getElementById('syncState');
  if (!el) return;
  const n = queueRead().length;
  const dead = deadCount();
  el.textContent = (n ? n + ' thay đổi đang gửi lên sheet…' : 'Đã đồng bộ xong.')
    + (dead ? ` ${dead} bản ghi lỗi nhiều lần đã được tách riêng.` : '');
}

async function loadAll() {
  const tz = -new Date().getTimezoneOffset();
  const res = await fetch(`${cfg.apiUrl}?token=${encodeURIComponent(cfg.token)}&tz=${tz}`);
  const d = await res.json();
  if (d.error) throw new Error(d.error);
  DB.raw = (d.raw || []).filter(r => r['Từ vựng']);
  DB.settings = Object.fromEntries((d.settings || []).map(s => [s.key, s.value]));
  DB.usage = d.usage_summary || null;
  DB.review = d.review_stats || null;
  DB.progress = {}; DB.enrichment = {};
  const ST = { '0': 'new', '1': 'learning', '2': 'review', '3': 'relearning' };
  (d.progress || []).forEach(p => {
    let state = ST[p.state] || p.state;
    const gapMin = (Date.parse(p.due) - Date.parse(p.last_review)) / 60000;     // khoảng từ lần ôn cuối tới hạn kế tiếp
    // Dữ liệu cũ từ app AI Studio: ghi "đang học" nhưng lịch cách nhiều giờ/ngày → thực chất là thẻ ôn tập.
    if ((state === 'learning' || state === 'relearning') && gapMin >= 720) state = 'review';
    // Bước học ngắn không được lưu riêng, nên suy ra từ khoảng chờ đã lưu: chờ ~1 phút = bước 1, chờ ~10 phút = bước 2.
    // Nếu không suy ra, mỗi lần tải lại app thẻ lại quay về bước 1 và không bao giờ tốt nghiệp (kẹt trong số thẻ đến hạn).
    let step = 0;
    if (state === 'learning' || state === 'relearning') learningSteps().forEach((m, i) => { if (gapMin >= m * 0.7) step = i; });
    DB.progress[p.word_id] = {
      ...p, state, S: +p.stability || 0, D: +p.difficulty || 0, reps: +p.reps || 0,
      lapses: +p.lapses || 0, stage: +p.stage || 0, step
    };
  });
  (d.enrichment || []).forEach(e => DB.enrichment[e.word_id] = e);
}

function cardOf(rawRow) {
  const p = DB.progress[rawRow.word_id];
  if (p && p.state) return p;
  return {
    word_id: rawRow.word_id, word: rawRow['Từ vựng'], state: 'new', stage: 0,
    due: nowISO(), S: 0, D: 0, reps: 0, lapses: 0, last_review: '', suspended: '',
    lang: rawRow['Ngôn ngữ'] || 'en', step: 0
  };
}
function persistCard(c) {
  DB.progress[c.word_id] = c;
  enqueue('upsertProgress', {
    word_id: c.word_id, word: c.word, state: c.state, stage: c.stage, due: c.due,
    stability: round(c.S, 4), difficulty: round(c.D, 4), reps: c.reps, lapses: c.lapses,
    last_review: c.last_review, suspended: c.suspended || '', updated_at: nowISO(), lang: c.lang
  });
}

/* ============================ GEMINI: 1 HÀM BỌC DUY NHẤT ============================ */
/* ---------- Model Gemini: thứ tự ưu tiên + tự chuyển khi hết hạn mức hoặc lỗi ----------
   Giá: USD / 1 triệu token, theo trang giá chính thức của Google (đầu ra đã gồm token suy luận). */
const MODELS = [
  { id: 'gemini-3.5-flash-lite', name: 'Gemini 3.5 Flash Lite', in: 0.30, out: 2.50 },
  { id: 'gemini-3.1-flash-lite', name: 'Gemini 3.1 Flash Lite', in: 0.25, out: 1.50 },
  { id: 'gemini-3.5-flash',      name: 'Gemini 3.5 Flash',      in: 1.50, out: 9.00 },
  { id: 'gemini-2.5-flash',      name: 'Gemini 2.5 Flash',      in: 0.30, out: 2.50 },
  { id: 'gemini-2.0-flash',      name: 'Gemini 2 Flash',        in: 0.10, out: 0.40, retired: '1/6/2026' },
  { id: 'gemini-2.0-flash-lite', name: 'Gemini 2 Flash Lite',   in: 0.075, out: 0.30, retired: '1/6/2026' }
];
const modelInfo = id => MODELS.find(m => m.id === id);
const MODEL_DOWN = 'vocab.modelDown';     // { modelId: hết-tạm-khóa-lúc (ms) }
const downMap = () => { try { return JSON.parse(localStorage.getItem(MODEL_DOWN) || '{}'); } catch { return {}; } };
function markDown(id, ms) { const m = downMap(); m[id] = Date.now() + ms; localStorage.setItem(MODEL_DOWN, JSON.stringify(m)); }
const isDown = id => (downMap()[id] || 0) > Date.now();
let lastModelUsed = '';

// Model người dùng chọn đứng đầu, sau đó là các model còn lại theo thứ tự ưu tiên.
function modelChain() {
  const chosen = DB.settings.model && DB.settings.model !== 'auto' ? DB.settings.model : MODELS[0].id;
  const ids = [chosen, ...MODELS.map(m => m.id).filter(id => id !== chosen)];
  const up = ids.filter(id => !isDown(id));
  return up.length ? up : ids;                 // tất cả đang bị khóa tạm thì vẫn thử lại từ đầu
}

class GeminiError extends Error {
  constructor(msg, { status = '', code = 0, fallback = true, aborted = false } = {}) { super(msg); this.status = status; this.code = code; this.fallback = fallback; this.aborted = aborted; }
}

// Giới hạn số request mỗi phút (ai_rpm trong Settings, mặc định 10) để không vượt hạn mức của Google.
const aiCalls = [];
const sleep = (ms, signal) => new Promise((res, rej) => {
  const t = setTimeout(res, ms);
  if (signal) signal.addEventListener('abort', () => { clearTimeout(t); rej(new GeminiError('Đã hủy.', { fallback: false, aborted: true })); }, { once: true });
});
const aiRpm = () => Math.max(1, +DB.settings.ai_rpm || 10);
async function rpmGate(signal) {
  for (;;) {
    if (signal && signal.aborted) throw new GeminiError('Đã hủy.', { fallback: false, aborted: true });
    const now = Date.now();
    while (aiCalls.length && now - aiCalls[0] >= 60000) aiCalls.shift();
    if (aiCalls.length < aiRpm()) { aiCalls.push(now); return; }
    const wait = 60000 - (now - aiCalls[0]) + 100;
    if (wait > 1500) toast(`Đang chờ ${Math.ceil(wait / 1000)} giây để không vượt giới hạn ${aiRpm()} request/phút…`, Math.min(wait, 4000));
    await sleep(wait, signal);
  }
}

async function callModel(model, { feature, wordId, prompt, schema, signal, maxTokens }) {
  await rpmGate(signal);
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${cfg.geminiKey}`;
  const body = { contents: [{ parts: [{ text: prompt }] }] };
  if (schema) body.generationConfig = { responseMimeType: 'application/json', responseSchema: schema };
  if (maxTokens) body.generationConfig = { ...(body.generationConfig || {}), maxOutputTokens: maxTokens };
  let json;
  try {
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal });
    json = await res.json();
  } catch (e) {
    if (e && e.name === 'AbortError') throw new GeminiError('Đã hủy.', { fallback: false, aborted: true });   // người dùng rời màn hình
    throw new GeminiError('Không kết nối được tới Gemini (kiểm tra mạng).', { fallback: false });
  }
  if (json.error) {
    const st = json.error.status || '', code = json.error.code || 0, msg = json.error.message || 'Lỗi không rõ';
    if (json.usageMetadata) logUsage(json, feature + '_error', wordId, model);
    const badKey = /API key|API_KEY/i.test(msg) && (code === 400 || code === 401 || code === 403);
    throw new GeminiError(msg, { status: st, code, fallback: !badKey });
  }
  const usage = logUsage(json, feature, wordId, model);
  // Kết quả bị cắt vì quá dài: báo để nơi gọi tự chia nhỏ danh sách rồi gửi lại.
  if (json.candidates?.[0]?.finishReason === 'MAX_TOKENS') throw new GeminiError('Kết quả quá dài, bị cắt giữa chừng.', { status: 'TOO_LONG', fallback: false });
  const text = json.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || '';
  let data = text;
  if (schema) {
    try { data = JSON.parse(text.replace(/^```(?:json)?|```$/g, '').trim()); }
    catch { throw new GeminiError('Model trả kết quả không đúng định dạng.', { status: 'BAD_OUTPUT' }); }
  }
  return { data, usage };
}

// Gọi lần lượt theo chuỗi ưu tiên. Hết hạn mức (429) → khóa model 10 phút; model không tồn tại/đã ngừng (404) → khóa 24 giờ.
async function callGemini(opts) {
  const chain = modelChain();
  let lastErr = null;
  for (const model of chain) {
    try {
      const r = await callModel(model, opts);
      if (model !== chain[0]) toast(`${modelInfo(chain[0])?.name || chain[0]} đang lỗi, đã chuyển sang ${modelInfo(model)?.name || model}.`, 3500);
      lastModelUsed = model;
      return r;
    } catch (e) {
      lastErr = e;
      if (!e.fallback) break;                                  // sai API key / mất mạng: đổi model cũng vô ích
      if (e.code === 429 || e.status === 'RESOURCE_EXHAUSTED') markDown(model, 10 * 60e3);
      else if (e.code === 404 || e.status === 'NOT_FOUND') markDown(model, 24 * 3600e3);
      else if (e.code >= 500) markDown(model, 2 * 60e3);
      console.warn(`Gemini ${model} lỗi, thử model kế tiếp:`, e.message);
    }
  }
  throw lastErr || new Error('Không gọi được Gemini');
}

// Đọc usageMetadata thật, tính tiền theo đơn giá của đúng model đã trả lời.
function logUsage(json, feature, wordId, model) {
  const u = json.usageMetadata || {};
  const inT = +u.promptTokenCount || 0;
  const outT = +u.candidatesTokenCount || 0;
  const thT = +u.thoughtsTokenCount || 0;
  const total = +u.totalTokenCount || inT + outT + thT;
  const info = modelInfo(model);
  const pin = info ? info.in : (+DB.settings.price_in_per_1m || 0);
  const pout = info ? info.out : (+DB.settings.price_out_per_1m || 0);
  const rate = +DB.settings.usd_vnd || 0;
  const cost = round((inT * pin + (outT + thT) * pout) / 1e6, 6);
  const row = {
    ts: nowISO(), feature, word_id: wordId, model,
    in_tokens: inT, out_tokens: outT, thought_tokens: thT, total_tokens: total,
    price_in_per_1m: pin, price_out_per_1m: pout,
    cost_usd: cost, usd_vnd: rate, cost_vnd: round(cost * rate, 2)
  };
  enqueue('appendUsage', row);
  return row;
}

/* ---------- Dữ liệu AI cho từng từ (tab Enrichment) ----------
   - Làm giàu lần đầu: khi từ chưa có dữ liệu, hoặc dữ liệu thiếu/kém (do app cũ tạo).
   - Làm mới định kỳ: sau mỗi `refresh_days` ngày (mặc định 10), AI viết câu điền chỗ trống mới,
     thêm ví dụ mới, mở rộng giải thích, từ gần nghĩa, họ từ. Chạy nền, không làm chậm lúc học. */

// Chuẩn hóa danh sách về mảng chuỗi: chấp nhận JSON mảng chuỗi, mảng {original, vi}, hoặc chuỗi cách nhau bằng dấu phẩy.
function listOf(v) {
  if (!v) return [];
  let arr;
  try { arr = JSON.parse(v); } catch { arr = null; }
  if (!Array.isArray(arr)) {
    const s = String(v).trim();
    if (!s || s === '[]') return [];
    arr = s.split(/(?<=\)),\s*|;\s*|\n+/).map(x => x.trim()).filter(Boolean);
  }
  return arr.map(x => {
    if (x && typeof x === 'object') {
      const o = x.original || x.en || x.sentence || x.text || '';
      return o + (x.vi ? ` (${x.vi})` : '');
    }
    return String(x);
  }).filter(Boolean);
}

const GENERIC = /Ghi nhớ bằng cách đặt câu/i;
function needsEnrich(e) {
  if (!e || !e.meaning_fixed || !e.cloze_sentence) return true;
  if (!e.definition_en || !listOf(e.examples).length || GENERIC.test(e.mnemonic || '')) return true;
  return false;
}
const refreshDays = () => +DB.settings.refresh_days || 10;
function isStale(e) {
  const t = Date.parse(e.refreshed_at || e.updated_at || '');
  return !t || Date.now() - t > refreshDays() * 864e5;
}

const ENRICH_SCHEMA = {
  type: 'OBJECT',
  properties: {
    meaning_fixed: { type: 'STRING' }, pos: { type: 'STRING' }, ipa: { type: 'STRING' },
    definition_en: { type: 'STRING' }, usage_note: { type: 'STRING' },
    synonyms: { type: 'ARRAY', items: { type: 'STRING' } }, word_family: { type: 'STRING' },
    collocations: { type: 'ARRAY', items: { type: 'STRING' } },
    cloze_sentence: { type: 'STRING' }, examples: { type: 'ARRAY', items: { type: 'STRING' } },
    mnemonic: { type: 'STRING' }, emoji: { type: 'STRING' },
    base_form: { type: 'STRING' }, romanization: { type: 'STRING' }, hanviet: { type: 'STRING' }
  },
  required: ['meaning_fixed', 'definition_en', 'usage_note', 'cloze_sentence', 'examples', 'emoji']
};

const COMMON_RULES = `- examples: mỗi câu viết dạng "câu ${'${lang}'} (bản dịch tiếng Việt)", tự nhiên như người bản xứ, đời thường, không hoa mỹ.
- cloze_sentence: MỘT câu ngắn, rõ nghĩa, chứa NGUYÊN VĂN từ/cụm cần học (đúng chính tả như mục từ, không chia khác đi) để có thể che từ đó làm bài điền chỗ trống.
- usage_note: 2–4 câu tiếng Việt giải thích sâu: sắc thái, khi nào dùng / không dùng, văn phong (trang trọng hay đời thường), lỗi người Việt hay mắc.
- synonyms: 2–4 từ gần nghĩa, mỗi mục kèm khác biệt ngắn gọn, ví dụ "amusing (nhẹ hơn hilarious)".
- word_family: các dạng cùng gốc, mỗi dạng viết đúng kiểu 'dạng (n)', 'dạng (v)', 'dạng (adj)' hoặc 'dạng (adv)', cách nhau bằng dấu phẩy, BAO GỒM cả chính từ đang học, mỗi loại từ chỉ một dạng phổ biến nhất. Ví dụ "enthusiasm (n), enthusiastic (adj), enthusiastically (adv)". Nếu không có họ từ rõ ràng thì để trống.`;

/* ---------- Gom request theo loại việc ----------
   - Làm giàu / làm mới: gửi TẤT CẢ từ cần xử lý tại thời điểm đó trong một request.
     Nếu danh sách quá dài so với giới hạn đầu ra của model, app tự chia nhỏ (và tự chia đôi nếu kết quả bị cắt).
   - Chấm bài: chấm ngay từng câu sau khi bạn trả lời, không bắt chờ. */
const MAX_PER_REQ = 20;      // trần an toàn cho một request làm giàu/làm mới (~1.000 token đầu ra mỗi từ)
const REFRESH_DAILY = 50;    // giới hạn số từ được làm mới mỗi ngày (giữ chi phí thấp)
const langNameOf = raw => raw['Ngôn ngữ'] === 'ko' ? 'tiếng Hàn' : 'tiếng Anh';
// Chi phí một request gộp được chia đều cho các từ trong đó khi ghi vào tab Enrichment.
const costShare = (u, n) => {
  const k = 1 / Math.max(1, n);
  return { model: u.model, in_tokens: Math.round(u.in_tokens * k), out_tokens: Math.round(u.out_tokens * k),
           thought_tokens: Math.round(u.thought_tokens * k), cost_usd: round(u.cost_usd * k, 6), cost_vnd: round(u.cost_vnd * k, 2) };
};
const itemsSchema = (props, required) => ({ type: 'OBJECT', properties: { items: { type: 'ARRAY', items: {
  type: 'OBJECT', properties: { i: { type: 'INTEGER' }, ...props }, required: ['i', ...required] } } }, required: ['items'] });
const ENRICH_BATCH_SCHEMA = itemsSchema(ENRICH_SCHEMA.properties, ENRICH_SCHEMA.required);
// Ghép kết quả theo chỉ số i; bỏ phần tử có chỉ số lạ hoặc trùng.
function byIndex(data, n) {
  const out = new Map();
  ((data && data.items) || []).forEach(it => { const i = +it.i; if (Number.isInteger(i) && i >= 0 && i < n && !out.has(i)) out.set(i, it); });
  return out;
}
// Chạy fn trên từng phần (tối đa maxPer mục); nếu kết quả bị cắt vì quá dài thì tự chia đôi rồi chạy lại.
async function inChunks(items, maxPer, fn) {
  const out = [];
  for (let i = 0; i < items.length; i += maxPer) out.push(...await splitRun(items.slice(i, i + maxPer), fn));
  return out;
}
async function splitRun(chunk, fn) {
  try { return await fn(chunk); }
  catch (e) {
    if (e && e.status === 'TOO_LONG' && chunk.length > 1) {
      const h = Math.ceil(chunk.length / 2);
      return [...await splitRun(chunk.slice(0, h), fn), ...await splitRun(chunk.slice(h), fn)];
    }
    throw e;
  }
}
const outBudget = n => Math.min(60000, 1200 * n + 1500);   // số token đầu ra cho phép, đủ rộng cho n từ

function enrichBatchPrompt(raws) {
  return `Bạn giúp một người Việt học ngoại ngữ. Hãy làm giàu dữ liệu cho ${raws.length} từ/cụm dưới đây (số đầu dòng là chỉ số i, mỗi từ ghi rõ ngôn ngữ).

${raws.map((r, i) => `${i}. "${r['Từ vựng']}" (${langNameOf(r)})
   Ngữ cảnh người học đã gặp: "${(r['Câu / Ngữ cảnh'] || '').slice(0, 500)}"
   Nghĩa người học tự ghi: "${r['Nghĩa tiếng Việt'] || ''}"`).join('\n')}

Trả JSON { items: [...] }, MỖI từ đúng một phần tử, có "i" là chỉ số ở trên, và các trường:
- meaning_fixed: nghĩa tiếng Việt ĐÚNG trong ngữ cảnh đó, ngắn gọn (sửa nếu nghĩa người học ghi bị sai).
- pos: từ loại trong ngữ cảnh (tiếng Việt). ipa: phiên âm IPA (để trống nếu là tiếng Hàn).
- definition_en: định nghĩa tiếng Anh đơn giản.
- collocations: 3–5 cụm đi kèm thông dụng, mỗi mục kèm nghĩa tiếng Việt trong ngoặc.
- examples: 2 câu ví dụ mới, trình độ B1.
${COMMON_RULES.replace('${lang}', 'ngôn ngữ của từ đó')}
- mnemonic: mẹo nhớ cụ thể cho người Việt (âm, hình ảnh, chiết tự), không chung chung.
- emoji: 1–2 emoji.
- base_form: dạng từ điển. romanization: phiên âm Latin nếu là tiếng Hàn. hanviet: âm Hán Việt nếu là từ gốc Hán, ngược lại để trống.`;
}

function refreshBatchPrompt(raws) {
  return `Bạn giúp một người Việt ôn lại các từ đã học được một thời gian. Với MỖI từ dưới đây, hãy làm MỚI nội dung để họ gặp từ trong những tình huống khác, hiểu sâu hơn, không học vẹt một câu.

${raws.map((r, i) => {
    const e = DB.enrichment[r.word_id] || {};
    return `${i}. "${r['Từ vựng']}" (${langNameOf(r)})
   Ngữ cảnh gốc: "${(r['Câu / Ngữ cảnh'] || '').slice(0, 300)}"
   Nghĩa hiện tại: "${e.meaning_fixed || r['Nghĩa tiếng Việt'] || ''}"
   Câu điền chỗ trống đang dùng: "${e.cloze_sentence || ''}"
   Các ví dụ đã có (KHÔNG lặp lại): ${JSON.stringify(listOf(e.examples).slice(0, 6))}
   Cụm đi kèm đã có: ${JSON.stringify(listOf(e.collocations).slice(0, 8))}
   Giải thích đã có: "${e.usage_note || ''}"`;
  }).join('\n')}

Trả JSON { items: [...] }, MỖI từ đúng một phần tử, có "i" là chỉ số ở trên, và các trường:
- meaning_fixed: giữ nguyên nghĩa hiện tại; chỉ sửa nếu nó SAI so với ngữ cảnh gốc. Nếu từ có nghĩa phổ biến khác, nói trong usage_note.
- pos, ipa, definition_en: giữ hoặc chỉnh cho chính xác hơn.
- cloze_sentence: một câu MỚI, bối cảnh khác hẳn câu đang dùng.
- examples: 2 câu ví dụ MỚI ở bối cảnh khác các ví dụ đã có.
- collocations: 2–3 cụm đi kèm MỚI, chưa có trong danh sách, kèm nghĩa tiếng Việt.
${COMMON_RULES.replace('${lang}', 'ngôn ngữ của từ đó')}
- usage_note: viết lại sâu hơn bản đã có, thêm điều mới (không lặp nguyên văn).
- mnemonic: giữ mẹo cũ nếu tốt, hoặc đưa mẹo mới dễ nhớ hơn.
- emoji: 1–2 emoji.`;
}

// Làm giàu mọi từ trong danh sách: một request nếu được, tự chia nhỏ khi quá dài. Trả về các word_id đã có dữ liệu.
async function enrichMany(raws, signal) {
  return inChunks(raws, MAX_PER_REQ, async part => {
    const { data, usage } = await callGemini({ feature: 'enrich', wordId: part.map(r => r.word_id).join(','),
      prompt: enrichBatchPrompt(part), schema: ENRICH_BATCH_SCHEMA, maxTokens: outBudget(part.length), signal });
    const got = byIndex(data, part.length), share = costShare(usage, got.size || 1), now = nowISO(), done = [];
    got.forEach((x, i) => {
      const raw = part[i];
      const row = {
        word_id: raw.word_id, word: raw['Từ vựng'],
        meaning_fixed: x.meaning_fixed || '', pos: x.pos || '', ipa: x.ipa || '',
        definition_en: x.definition_en || '', collocations: JSON.stringify(x.collocations || []),
        cloze_sentence: x.cloze_sentence || '', examples: JSON.stringify(x.examples || []),
        mnemonic: x.mnemonic || '', emoji: x.emoji || '', updated_at: now,
        lang: raw['Ngôn ngữ'] || 'en', base_form: x.base_form || '',
        romanization: x.romanization || '', hanviet: x.hanviet || '',
        usage_note: x.usage_note || '', synonyms: JSON.stringify(x.synonyms || []), word_family: x.word_family || '',
        refreshed_at: now, refresh_count: 0, ...share
      };
      DB.enrichment[raw.word_id] = row;
      enqueue('upsertEnrichment', row);
      done.push(raw.word_id);
    });
    return done;
  });
}
async function enrich(raw, signal) {
  const done = await enrichMany([raw], signal);
  if (!done.length) throw new Error('AI không trả dữ liệu cho từ này.');
  return DB.enrichment[raw.word_id];
}

// Làm mới: câu điền mới + ví dụ mới được thêm lên đầu (giữ tối đa 6), cụm đi kèm cộng dồn (tối đa 10).
function mergeRefresh(e, x, share) {
  const uniq = arr => [...new Map(arr.filter(Boolean).map(v => [norm(v), v])).values()];
  const oldCloze = e.cloze_sentence ? [e.cloze_sentence] : [];
  const now = nowISO();
  return {
    ...e,
    meaning_fixed: x.meaning_fixed || e.meaning_fixed,
    pos: x.pos || e.pos, ipa: x.ipa || e.ipa, definition_en: x.definition_en || e.definition_en,
    cloze_sentence: x.cloze_sentence || e.cloze_sentence,
    examples: JSON.stringify(uniq([...(x.examples || []), ...listOf(e.examples), ...oldCloze]).slice(0, 6)),
    collocations: JSON.stringify(uniq([...listOf(e.collocations), ...(x.collocations || [])]).slice(0, 10)),
    usage_note: x.usage_note || e.usage_note || '',
    synonyms: JSON.stringify(uniq([...(x.synonyms || []), ...listOf(e.synonyms)]).slice(0, 5)),
    word_family: x.word_family || e.word_family || '',
    mnemonic: x.mnemonic || e.mnemonic, emoji: x.emoji || e.emoji,
    updated_at: now, refreshed_at: now, refresh_count: (+e.refresh_count || 0) + 1,
    ...share
  };
}
async function refreshMany(raws, signal) {
  raws = raws.filter(r => r && DB.enrichment[r.word_id]);
  const done = await inChunks(raws, MAX_PER_REQ, async part => {
    const { data, usage } = await callGemini({ feature: 'refresh', wordId: part.map(r => r.word_id).join(','),
      prompt: refreshBatchPrompt(part), schema: ENRICH_BATCH_SCHEMA, maxTokens: outBudget(part.length), signal });
    const got = byIndex(data, part.length), share = costShare(usage, got.size || 1), ok = [];
    got.forEach((x, i) => {
      const raw = part[i];
      const row = mergeRefresh(DB.enrichment[raw.word_id], x, share);
      DB.enrichment[raw.word_id] = row;
      enqueue('upsertEnrichment', row);
      ok.push(raw.word_id);
    });
    return ok;
  });
  dailyStat('refresh', done.length);
  return done;
}
async function refreshEnrichment(raw, signal) {
  if (!DB.enrichment[raw.word_id]) return enrich(raw, signal);
  const done = await refreshMany([raw], signal);
  if (!done.length) throw new Error('AI không trả dữ liệu cho từ này.');
  return DB.enrichment[raw.word_id];
}

/* Làm mới định kỳ (sau refresh_days ngày):
   - Đầu mỗi phiên: làm mới chạy nền cho TẤT CẢ thẻ quá hạn trong phiên đó, một request.
   - Thẻ ôn thêm quá hạn được ghi vào danh sách chờ, gửi gộp ở cuối phiên hoặc đầu phiên sau. */
const RPEND = 'vocab.refreshPending';
const pendingRefresh = () => { try { return JSON.parse(localStorage.getItem(RPEND) || '[]'); } catch { return []; } };
const savePending = p => localStorage.setItem(RPEND, JSON.stringify(p));
const rawById = id => DB.raw.find(r => r.word_id === id);
const staleId = id => { const e = DB.enrichment[id]; return !!(e && !needsEnrich(e) && isStale(e) && rawById(id)); };
let refreshing = false;
function scheduleRefresh(items) {
  if (!cfg.geminiKey) return;
  const p = pendingRefresh();
  items.filter(Boolean).forEach(x => { const id = x.raw.word_id; if (staleId(id) && !p.includes(id)) p.push(id); });
  savePending(p);
}
async function flushRefresh(extra = []) {
  if (!cfg.geminiKey || refreshing) return [];
  const ids = [...new Set([...pendingRefresh(), ...extra.filter(Boolean).map(x => x.raw.word_id)])].filter(staleId);
  savePending(ids);
  const take = ids.slice(0, Math.max(0, REFRESH_DAILY - dailyStat('refresh')));
  if (!take.length) return [];
  refreshing = true;
  try {
    const done = await refreshMany(take.map(rawById));
    savePending(pendingRefresh().filter(id => !done.includes(id)));
    return done;
  } catch (err) { console.warn('Làm mới thất bại', err); return []; }
  finally { refreshing = false; }
}
// Nút "Làm mới" trên một từ: gửi kèm mọi từ đang chờ làm mới trong cùng request.
async function refreshNow(raw, signal) {
  if (!DB.enrichment[raw.word_id] || needsEnrich(DB.enrichment[raw.word_id])) { await enrich(raw, signal); return [raw.word_id]; }
  const others = pendingRefresh().filter(id => id !== raw.word_id && staleId(id)).map(rawById);
  const done = await refreshMany([raw, ...others], signal);
  savePending(pendingRefresh().filter(id => !done.includes(id)));
  if (!done.includes(raw.word_id)) throw new Error('AI không trả dữ liệu cho từ này.');
  return done;
}

// Chấm câu tự viết: gọi ngay sau khi bạn trả lời. list: [{ word, meaning, text }]
const GRADE_SCHEMA = itemsSchema({ score: { type: 'INTEGER' }, feedback_vi: { type: 'STRING' }, corrected: { type: 'STRING' } },
  ['score', 'feedback_vi', 'corrected']);
async function gradeMany(list, signal) {
  const { data } = await callGemini({ feature: 'grade', schema: GRADE_SCHEMA, signal, prompt:
`Người Việt đang học ngoại ngữ. Mỗi câu dưới đây họ tự viết để dùng một từ cần ôn (số đầu dòng là chỉ số i).
${list.map((x, i) => `${i}. từ "${x.word}" (nghĩa: ${x.meaning}) — câu của người học: "${x.text}"`).join('\n')}

Với MỖI câu trả một phần tử { i, score, feedback_vi, corrected }:
- score 0–3: 3 = dùng đúng nghĩa, đúng ngữ pháp, tự nhiên; 2 = đúng ý nhưng có lỗi nhỏ hoặc chưa tự nhiên; 1 = dùng sai nghĩa hoặc sai ngữ pháp nặng; 0 = không dùng từ cần ôn hoặc sai hẳn.
- feedback_vi: 1–2 câu tiếng Việt, thẳng thắn, hữu ích.
- corrected: câu đã sửa cho tự nhiên (đã tốt thì giữ nguyên).` });
  return byIndex(data, list.length);
}

/* ============================ XẾP HÀNG ĐỢI THẺ ============================ */
function buildSession(lang) {
  const t = new Date();
  const rows = DB.raw.filter(r => (r['Ngôn ngữ'] || 'en') === lang);
  const cards = rows.map(r => ({ raw: r, card: cardOf(r) })).filter(x => x.card.suspended !== 'true');

  const due = cards.filter(x => x.card.state !== 'new' && new Date(x.card.due) <= t);
  const fresh = cards.filter(x => x.card.state === 'new');

  // Thẻ ôn: R thấp nhất (sắp quên nhất) lên trước; hòa thì lapses cao hơn trước.
  due.forEach(x => {
    const el = x.card.last_review ? days(t, x.card.last_review) : 0;
    x.R = x.card.S > 0 ? retrievability(el, x.card.S) : 0;
  });
  due.sort((a, b) => a.R - b.R || b.card.lapses - a.card.lapses);

  // Giới hạn từ mới; tồn đọng nhiều thì tạm dừng từ mới.
  const limit = +DB.settings['daily_new_' + lang] || 0;
  const todayNew = dailyStat('new_' + lang);
  const backlog = due.length > 2 * Math.max(10, avgDue());
  let quota = backlog ? 0 : Math.max(0, limit - todayNew);
  const newOnes = fresh.slice(0, quota);

  // Rải đều thẻ mới vào giữa các thẻ ôn.
  const queue = [...due];
  if (newOnes.length) {
    const gap = Math.max(3, Math.floor(due.length / newOnes.length) || 3);
    newOnes.forEach((x, i) => queue.splice(Math.min(queue.length, (i + 1) * gap + i), 0, x));
  }
  // Không để 2 thẻ cùng nguồn đứng liền nhau.
  for (let i = 1; i < queue.length; i++) {
    if (queue[i].raw['Nguồn (URL)'] && queue[i].raw['Nguồn (URL)'] === queue[i - 1].raw['Nguồn (URL)']) {
      const j = queue.findIndex((x, k) => k > i && x.raw['Nguồn (URL)'] !== queue[i - 1].raw['Nguồn (URL)']);
      if (j > -1) [queue[i], queue[j]] = [queue[j], queue[i]];
    }
  }
  return { lang, queue, done: 0, total: queue.length, backlog, newCount: newOnes.length };
}

function dailyStat(key, add = 0) {
  const all = JSON.parse(localStorage.getItem(LS.stats) || '{}');
  const d = new Date().toISOString().slice(0, 10);
  all[d] ||= {}; all[d][key] = (all[d][key] || 0) + add;
  if (add) localStorage.setItem(LS.stats, JSON.stringify(all));
  return all[d][key] || 0;
}
function avgDue() {
  const all = JSON.parse(localStorage.getItem(LS.stats) || '{}');
  const v = Object.values(all).slice(-7).map(d => d.reviews || 0).filter(Boolean);
  return v.length ? v.reduce((a, b) => a + b) / v.length : 10;
}

/* ============================ CHẤM & SO KHỚP ============================ */
function levenshtein(a, b) {
  const m = Array.from({ length: b.length + 1 }, (_, i) => [i, ...Array(a.length).fill(0)]);
  for (let j = 0; j <= a.length; j++) m[0][j] = j;
  for (let i = 1; i <= b.length; i++) for (let j = 1; j <= a.length; j++)
    m[i][j] = Math.min(m[i - 1][j] + 1, m[i][j - 1] + 1, m[i - 1][j - 1] + (a[j - 1] === b[i - 1] ? 0 : 1));
  return m[b.length][a.length];
}
const norm = s => String(s || '').toLowerCase().trim().replace(/[.,!?;:"']/g, '');
// Tiếng Hàn: so khớp ở mức jamo để lỗi một nét chỉ bị tính là lỗi nhẹ.
const jamo = s => s.normalize('NFD');

function checkAnswer(input, accepted) {
  const a = jamo(norm(input));
  let best = 99;
  accepted.filter(Boolean).forEach(x => best = Math.min(best, levenshtein(a, jamo(norm(x)))));
  return { exact: best === 0, near: best <= 1, dist: best };
}
const RATING = { 1: 'Quên', 2: 'Khó', 3: 'Được', 4: 'Dễ' };

// App tự chấm. Bài chọn đáp án: dưới 2s Dễ, 2-6s Được, 6-15s Khó, trên 15s hoặc sai là Quên.
// Bài gõ từ: cộng thêm `type_extra_sec` giây (mặc định 10) cho mỗi mốc → dưới 12s Dễ, 12–16s Được, 16–25s Khó.
// Gõ sai dưới 15% ký tự tính là Được, sai nhiều hơn là Quên.
const typeExtra = () => { const v = parseFloat(DB.settings.type_extra_sec); return isFinite(v) && v >= 0 ? v : 10; };
function autoRating({ mode, exact, errorRatio = 1, ms }) {
  if (mode === 'guess') return exact ? 3 : 2;      // đoán trước khi học: không phạt, chỉ phân biệt đoán đúng ý hay chưa
  const typing = mode === 'type';
  if (!exact) return (typing && errorRatio < 0.15) ? 3 : 1;
  const s = ms / 1000, b = typing ? typeExtra() : 0;
  if (s < 2 + b) return 4;
  if (s < 6 + b) return 3;
  if (s < 15 + b) return 2;
  return 1;
}
function ratingReason(m, g) {
  if (!m) return 'theo nhận xét của AI';
  if (m.mode === 'guess') return m.skipped ? 'chưa đoán, bình thường với từ mới' : m.ov >= 0.5 ? 'đoán đúng ý' : m.ov > 0 ? 'đoán gần đúng' : 'đoán chưa đúng, bình thường với từ mới';
  const pct = Math.round(m.errorRatio * 100);
  if (!m.exact) {
    if (m.mode !== 'type') return 'chọn sai';
    return g === 3 ? `sai ${pct}% ký tự, vẫn tính là nhớ được` : `sai ${pct}% ký tự`;
  }
  return `đúng sau ${(m.ms / 1000).toFixed(1)} giây`;
}

function speak(text, lang, rate = 0.95) {
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang === 'ko' ? 'ko-KR' : 'en-US';
  u.rate = rate;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

let bulkRunning = false, bulkCtrl = null;
async function bulkRun(mode) {
  if (bulkRunning) return;
  bulkRunning = true;
  const ctrl = bulkCtrl = new AbortController();
  const list = aiDataLists()[mode === 'enrich' ? 'missing' : 'stale'];
  let ok = 0, fail = 0;
  const say = t => { const el = document.getElementById('bulkState'); if (el) el.textContent = t; };
  const stop = document.getElementById('bulkStop');
  if (stop) { stop.classList.remove('hide'); stop.onclick = () => ctrl.abort(); }
  if (list.length) {
    const raws = list.map(x => x.raw);
    say(`Đang xử lý ${raws.length} từ${raws.length > MAX_PER_REQ ? ` (chia ${Math.ceil(raws.length / MAX_PER_REQ)} lần gọi)` : ' trong một lần gọi'}…`);
    try {
      const done = mode === 'enrich' ? await enrichMany(raws, ctrl.signal) : await refreshMany(raws, ctrl.signal);
      ok = done.length; fail = raws.length - done.length;
      if (mode === 'refresh') savePending(pendingRefresh().filter(id => !done.includes(id)));
    } catch (err) { if (!(err && err.aborted)) { fail = raws.length; console.warn(err); } }
  }
  const stopped = ctrl.signal.aborted;
  await flush(true);
  bulkRunning = false; bulkCtrl = null;
  toast(`${stopped ? 'Đã dừng' : 'Xong'}: ${ok} từ${fail ? `, ${fail} từ lỗi` : ''}.`, 3000);
  if (document.getElementById('bulkState')) viewSettings();
}

/* ============================ PHIÊN HỌC ============================ */
const enrichFailed = new Set();
const isLearning = c => c.state === 'learning' || c.state === 'relearning';

/* Phiên học có hai phần:
   - queue: thẻ ĐẾN HẠN + từ mới trong hạn mức → kết quả TÍNH vào lịch ôn (FSRS).
   - practice: thẻ CHƯA đến hạn, xếp theo ưu tiên thông thường (sắp quên nhất trước) → chỉ GHI LOG
     (số lần, đúng/sai) mà không đổi lịch ôn, độ bền hay cấp bài tập của từ. */
function newSession(lang, queue, extra = {}) {
  return { lang, queue, done: 0, total: queue.length, backlog: false, newCount: 0,
           practice: [], practiced: 0, practiceMode: false, recent: [], current: null, ...extra };
}

async function startSession(lang) {
  session = buildSession(lang);
  Object.assign(session, newSession(lang, session.queue, { backlog: session.backlog, newCount: session.newCount }));
  if (!session.total) {
    if (!buildPracticePool(lang).length) { toast('Chưa có từ nào để ôn. Lưu thêm từ rồi quay lại.'); return; }
    session.practiceMode = true;
    toast('Không có thẻ đến hạn. Đang ôn thêm, kết quả không tính vào lịch ôn.', 3500);
  } else if (session.backlog) toast('Đang tồn đọng nhiều thẻ ôn, hôm nay tạm dừng từ mới.', 3500);
  flushRefresh(session.queue);   // chạy nền: làm mới mọi thẻ quá hạn của phiên này trong một request
  nextCard();
}

// Thẻ chưa đến hạn của ngôn ngữ đang học, xếp theo ưu tiên: R thấp nhất trước, rồi số lần quên.
function buildPracticePool(lang) {
  const now = Date.now();
  const busy = new Set([...(session ? session.queue : []), session && session.current].filter(Boolean).map(x => x.raw.word_id));
  // Từ đã gặp trong phiên này xếp xuống cuối; 5 từ vừa ôn thêm xếp cuối cùng, để không lặp lại ngay.
  const seen = new Set(session ? session.recent : []);
  const last5 = new Set(session ? session.recent.slice(-5) : []);
  const rank = id => last5.has(id) ? 2 : seen.has(id) ? 1 : 0;
  const items = DB.raw.filter(r => (r['Ngôn ngữ'] || 'en') === lang)
    .map(r => ({ raw: r, card: cardOf(r) }))
    .filter(x => x.card.suspended !== 'true' && x.card.state !== 'new' && !busy.has(x.raw.word_id)
              && new Date(x.card.due).getTime() > now);
  items.forEach(x => {
    const el = x.card.last_review ? days(new Date(), x.card.last_review) : 0;
    x.R = x.card.S > 0 ? retrievability(el, x.card.S) : 0;
  });
  items.sort((a, b) => (rank(a.raw.word_id) - rank(b.raw.word_id)) || a.R - b.R || b.card.lapses - a.card.lapses);
  for (let i = 1; i < items.length; i++) {           // tránh 2 từ cùng bài báo đứng liền nhau
    const src = x => x.raw['Nguồn (URL)'];
    if (src(items[i]) && src(items[i]) === src(items[i - 1])) {
      const j = items.findIndex((x, k) => k > i && src(x) !== src(items[i - 1]));
      if (j > -1) [items[i], items[j]] = [items[j], items[i]];
    }
  }
  return items.map(x => ({ raw: x.raw, card: x.card, practice: true }));
}

function nextPractice() {
  if (!session.practice.length && !session.custom) session.practice = buildPracticePool(session.lang);
  return session.practice.shift() || null;
}

// Chọn thẻ kế tiếp. Trả về null nếu hết thẻ tính điểm và chưa bật ôn thêm.
function pickNext() {
  const now = Date.now();
  const q = session.queue;
  const waiting = x => isLearning(x.card) && new Date(x.card.due).getTime() > now;
  // 1) thẻ đang ở bước học ngắn đã tới giờ, 2) thẻ đến hạn / từ mới theo thứ tự đã xếp
  let i = q.findIndex(x => isLearning(x.card) && !waiting(x));
  if (i < 0) i = q.findIndex(x => !waiting(x));
  if (i > -1) return { item: q.splice(i, 1)[0], scored: true };
  // 3) chỉ còn thẻ đang chờ bước học ngắn: lấp khoảng trống bằng thẻ ôn thêm
  if (q.length) {
    const p = nextPractice();
    if (p) return { item: p, scored: false };
    q.sort((a, b) => new Date(a.card.due) - new Date(b.card.due));   // không có gì khác: học trước giờ một chút
    return { item: q.shift(), scored: true };
  }
  // 4) hết thẻ tính điểm
  if (session.practiceMode || session.custom) {
    const p = nextPractice();
    if (p) return { item: p, scored: false };
  }
  return null;
}

async function nextCard() {
  const pick = pickNext();
  if (!pick) return endScreen();
  const item = pick.item;
  item._scored = pick.scored;
  session.current = item;
  if (cfg.geminiKey && needsEnrich(DB.enrichment[item.card.word_id]) && !enrichFailed.has(item.card.word_id)) {
    // Gom từ này + MỌI thẻ khác trong phiên cũng đang thiếu dữ liệu → một request (tự chia nhỏ nếu quá dài).
    const want = r => r && r.word_id !== item.raw.word_id && needsEnrich(DB.enrichment[r.word_id]) && !enrichFailed.has(r.word_id);
    const pool = [...session.queue, ...(session.practiceMode || session.custom ? (session.practice || []) : [])];
    const more = [...new Map(pool.map(x => x.raw).filter(want).map(r => [r.word_id, r])).values()];
    const batch = [item.raw, ...more];
    render(`<div class="card"><p class="muted">AI đang chuẩn bị nội dung cho ${batch.length > 1 ? batch.length + ' từ (một lần gọi)' : 'từ này'}…</p></div>`);
    try {
      const done = await enrichMany(batch);
      batch.forEach(r => { if (!done.includes(r.word_id)) enrichFailed.add(r.word_id); });
    } catch (e) { batch.forEach(r => enrichFailed.add(r.word_id)); toast('Không gọi được Gemini: ' + e.message, 3500); }
  }
  showCard(item);
}

function endScreen() {
  flush(true);
  flushRefresh();                // gửi gộp các thẻ ôn thêm đang chờ làm mới
  session.current = null;
  const canMore = !session.custom && buildPracticePool(session.lang).length > 0;
  const studied = [...new Set(session.recent)];
  const canStory = cfg.geminiKey && studied.length >= 3;
  const parts = [];
  if (session.done) parts.push(`${session.done} thẻ đến hạn`);
  if (session.practiced) parts.push(`${session.practiced} lượt ôn thêm`);
  render(`<div class="bar"><h1>Xong phiên</h1></div>
    <div class="card">
      <p>${parts.length ? 'Bạn đã ôn ' + parts.join(' và ') + '.' : 'Không còn thẻ nào.'}</p>
      ${canMore ? '<p class="muted">Vẫn muốn học tiếp? Phần ôn thêm chỉ ghi lại số lần và đúng/sai, không làm thay đổi lịch ôn của từ.</p>' : ''}
      <p class="muted" id="syncState"></p>
      <div class="row" style="margin-top:14px">
        ${canMore ? '<button class="primary" id="more">Ôn thêm</button>' : ''}
        ${canStory ? '<button id="story">Đọc truyện với các từ vừa ôn</button>' : ''}
        <button class="${canMore ? '' : 'primary'}" id="home">Về trang chủ</button>
      </div>
      ${canMore ? '<p class="muted kbdhint">Enter để ôn thêm</p>' : ''}
    </div>`);
  updateSyncBadge();
  $('#home').onclick = once(viewHome);
  const more = $('#more');
  if (more) more.onclick = once(() => { session.practiceMode = true; nextCard(); });
  const st = $('#story');
  if (st) st.onclick = once(() => { startStory(session.lang, studied); });
}

function cardData(item) {
  const e = DB.enrichment[item.card.word_id] || {};
  const raw = item.raw;
  const word = raw['Từ vựng'];
  const meaning = e.meaning_fixed || raw['Nghĩa tiếng Việt'] || '';
  const sentence = e.cloze_sentence || raw['Câu / Ngữ cảnh'] || '';
  return { e, raw, word, meaning, sentence, lang: raw['Ngôn ngữ'] || 'en' };
}

/* ============================ DẠNG BÀI TRONG VÒNG ÔN CHÍNH ============================
   Mỗi cấp (stage) có vài cách hỏi khác nhau; app xoay vòng theo số lần đã ôn của từ, và chỉ dùng
   cách nào đủ dữ liệu. Từ mới (chưa học) bắt đầu bằng "đoán nghĩa trước". */
const STOP = new Set(['la', 'cua', 'mot', 'cac', 'nhung', 'su', 'viec', 'cai', 'duoc', 'va', 'co', 'khong', 'rat', 'nhu', 'de', 'trong', 'cho', 'den', 'voi']);
const stripVi = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd');
const toks = s => stripVi(s).split(/[^a-z0-9]+/).filter(t => t && !STOP.has(t));
// Tỷ lệ các từ trong nghĩa chuẩn mà người học đoán trúng (bỏ dấu, bỏ từ đệm).
function guessOverlap(guess, targets) {
  const g = new Set(toks(guess));
  if (!g.size) return 0;
  return Math.max(0, ...targets.filter(Boolean).map(t => {
    const tt = toks(t);
    return tt.length ? tt.filter(x => g.has(x)).length / tt.length : 0;
  }));
}

const POSVI = { n: 'danh từ', v: 'động từ', adj: 'tính từ', adv: 'phó từ' };
const synHeads = e => listOf(e.synonyms).map(x => x.replace(/\s*[(（].*$/, '').trim()).filter(Boolean);
function parseFamily(s) {
  return String(s || '').split(/[,;，]/).map(x => x.trim()).map(x => {
    const m = x.match(/^(.+?)\s*\(\s*(n|v|adj|adv)\.?\s*\)$/i);
    return m ? { form: m[1].trim(), pos: m[2].toLowerCase() } : null;
  }).filter(Boolean);
}
// Loại từ của từ đang học, đọc từ chữ tiếng Việt AI ghi ở cột pos ("danh từ", "phó từ"...).
function posOf(s) {
  s = stripVi(s);
  if (/danh tu|noun/.test(s)) return 'n';
  if (/dong tu|verb/.test(s)) return 'v';
  if (/tinh tu|adjective/.test(s)) return 'adj';
  if (/pho tu|trang tu|adverb/.test(s)) return 'adv';
  return null;
}
const sharedPrefix = (a, b) => { a = norm(a); b = norm(b); let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++; return i; };

// Câu hỏi "đổi dạng từ" dạng chọn: hỏi một loại từ khác với từ đang học, các lựa chọn là những từ cùng họ do AI cung cấp.
// Chỉ hỏi loại từ mà họ từ có đúng MỘT dạng, để luôn chỉ có một đáp án đúng.
function familyQuestion(item, d) {
  if (/\s/.test(d.word)) return null;                                   // chỉ áp dụng cho từ đơn
  const uniq = [...new Map(parseFamily(d.e.word_family).filter(f => !/\s/.test(f.form)).map(f => [norm(f.form), f])).values()];
  const own = uniq.find(f => norm(f.form) === norm(d.word));
  const ownPos = own ? own.pos : posOf(d.e.pos);
  if (!ownPos) return null;                                             // không biết loại từ của từ đang học thì câu hỏi sẽ mơ hồ
  const others = uniq.filter(f => norm(f.form) !== norm(d.word));
  const count = {};
  others.forEach(f => { count[f.pos] = (count[f.pos] || 0) + 1; });
  const cands = others.filter(f => f.pos !== ownPos && count[f.pos] === 1);
  if (!cands.length) return null;                                       // ví dụ chỉ có "ensemble (n)" cho "Ensembles (n)": cùng loại từ, không đáng hỏi
  const t = cands[(item.card.reps || 0) % cands.length];
  const wrong = others.filter(f => f !== t).map(f => f.form).slice(0, 3);
  // Thiếu thì bù bằng từ của họ từ khác (loại bỏ từ có chung gốc với từ đang học để không thành đáp án đúng thứ hai)
  const strange = [];
  Object.values(DB.enrichment).forEach(e2 => parseFamily(e2.word_family).forEach(f => {
    if (/\s/.test(f.form) || strange.some(s => norm(s.form) === norm(f.form))) return;
    if (sharedPrefix(f.form, d.word) >= 4 || sharedPrefix(f.form, t.form) >= 4) return;
    if (uniq.some(u => norm(u.form) === norm(f.form))) return;
    strange.push(f);
  }));
  strange.sort((a, b) => (b.pos === t.pos) - (a.pos === t.pos));
  const options = [t.form, ...wrong];
  for (const s of strange) { if (options.length >= 4) break; options.push(s.form); }
  if (options.length < 3) return null;
  return { t, ownPos, options: shuffle(options), family: own ? uniq : [{ form: d.word, pos: ownPos }, ...uniq] };
}

function availableExercises(item, d) {
  const e = d.e, sent = d.sentence || '', def = String(e.definition_en || '');
  const hasW = !!sent && rx(d.word).test(sent);
  return {
    choice: true,
    guess: item.card.state === 'new' && !!d.meaning && !!d.raw['Câu / Ngữ cảnh'],
    nuance: synHeads(e).filter(x => norm(x) !== norm(d.word)).length >= 2 && def.length > 8 && hasW,
    cloze: true,
    dictation: hasW && typeof window !== 'undefined' && 'speechSynthesis' in window,
    recall: true,
    defguess: def.length > 8,
    family: !!familyQuestion(item, d),
    write: true
  };
}
const EX_TIERS = [['choice', 'nuance'], ['cloze', 'dictation'], ['recall', 'defguess', 'family'], ['write']];
function pickExercise(item, d) {
  const a = availableExercises(item, d);
  if (item.card.state === 'new' && a.guess) return 'guess';
  const tier = EX_TIERS[clamp(item.card.stage ?? 0, 0, 3)];
  const list = tier.filter(k => a[k]);
  return list.length ? list[(item.card.reps || 0) % list.length] : tier[0];
}

// Mọi bài "gõ từ" dùng chung một khung: cloze, nhớ từ theo nghĩa, đoán qua định nghĩa, đổi dạng từ, nghe chép.
function typedEx({ item, d, head, started, finish }, { hint, label = 'Gõ từ', accepted, audio = false }) {
  render(head + `
    <div class="card">
      ${hint}
      <label for="ans">${label}</label>
      <input id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <div class="row" style="margin-top:12px">
        ${audio ? '<button id="again">🔊 Nghe lại, chậm hơn</button>' : ''}
        <button class="primary" id="ok">Kiểm tra</button>
      </div>
    </div>`);
  $('#ans').focus();
  const submit = () => {
    const r = checkAnswer($('#ans').value, accepted);
    const len = Math.max(norm(accepted[0]).length, 1);
    const m = { mode: 'type', exact: r.exact, errorRatio: Math.min(1, r.dist / len), ms: Date.now() - started };
    finish(autoRating(m), '', m);
  };
  const guarded = once(submit);
  $('#ok').onclick = guarded;
  // Enter chỉ nộp khi đã gõ gì đó (tránh lỡ tay tính là Quên) và không đang trong lúc gõ dấu/Hangul.
  $('#ans').onkeydown = e => { if (enterOK(e) && $('#ans').value.trim()) guarded(); };
  if (audio) {
    speak(d.sentence, d.lang);
    $('#again').onclick = () => speak(d.sentence, d.lang, 0.7);
  }
}

function choiceEx({ item, d, head, started, finish }, { hint, options, answer, after = '' }) {
  render(head + `
    <div class="card">
      ${hint}
      <div id="opts">${options.map((o, i) => `<button class="choice" data-v="${esc(o)}"><span class="k">${i + 1}</span>${esc(o)}</button>`).join('')}</div>
      <p class="muted kbdhint">Bấm phím 1–${options.length} để chọn nhanh</p>
    </div>`);
  app.querySelectorAll('.choice').forEach(b => b.onclick = once(() => {
    const ok = b.dataset.v === answer;
    b.classList.add(ok ? 'right' : 'wrong');
    const m = { mode: 'choice', exact: ok, errorRatio: ok ? 0 : 1, ms: Date.now() - started };
    finish(autoRating(m), after, m);
  }));
}

const EX = {
  // Từ mới: đoán trước khi xem đáp án (kiểm tra trước giúp nhớ đáp án đúng lâu hơn)
  guess({ d, head, started, finish }) {
    render(head + `
      <div class="card">
        <span class="pill accent">Từ mới</span>
        <div class="word" style="margin-top:8px">${esc(d.word)}</div>
        ${d.raw['Câu / Ngữ cảnh'] ? `<p class="context">${highlight(d.raw['Câu / Ngữ cảnh'], d.word)}</p>` : ''}
        <p class="muted">Đoán xem từ này nghĩa là gì. Đoán sai cũng không sao: cố đoán trước giúp bạn nhớ đáp án lâu hơn.</p>
        <input id="ans" placeholder="Nghĩa tiếng Việt bạn đoán…" autocomplete="off">
        <div class="row" style="margin-top:12px"><button id="skip">Chưa biết</button><button class="primary" id="ok">Đoán</button></div>
      </div>`);
    $('#ans').focus();
    const go = skipped => {
      const text = skipped ? '' : $('#ans').value.trim();
      const ov = guessOverlap(text, [d.meaning, d.raw['Nghĩa tiếng Việt']]);
      const m = { mode: 'guess', exact: ov >= 0.5, ov, skipped: skipped || !text, ms: Date.now() - started };
      finish(autoRating(m), text ? `<p class="muted">Bạn đoán: “${esc(text)}”</p>` : '', m);
    };
    $('#ok').onclick = once(() => go(false));
    $('#skip').onclick = once(() => go(true));
    $('#ans').onkeydown = e => { if (enterOK(e) && $('#ans').value.trim()) $('#ok').click(); };
  },

  choice(c) {
    const { d } = c;
    const others = DB.raw.filter(r => r.word_id !== d.raw.word_id)
      .map(r => (DB.enrichment[r.word_id]?.meaning_fixed) || r['Nghĩa tiếng Việt']).filter(Boolean);
    choiceEx(c, {
      hint: `<div class="word">${esc(d.word)}</div>
        ${d.sentence ? `<p class="context">${highlight(d.sentence, d.word)}</p>` : ''}
        <p class="muted">Nghĩa nào đúng trong câu này?</p>`,
      options: shuffle([d.meaning, ...shuffle(others).slice(0, 3)]), answer: d.meaning
    });
  },

  // Chọn từ đúng sắc thái trong các từ gần nghĩa
  nuance(c) {
    const { d } = c;
    const heads = [...new Set(synHeads(d.e).filter(x => norm(x) !== norm(d.word)))].slice(0, 3);
    choiceEx(c, {
      hint: `<p class="context">${blankOut(d.sentence, d.word)}</p>
        <p class="muted">Gợi ý: ${blankOut(d.e.definition_en, d.word)}</p>
        <p class="muted">Từ nào hợp nhất với chỗ trống?</p>`,
      options: shuffle([d.word, ...heads]), answer: d.word
    });
  },

  cloze(c) {
    const { d } = c;
    typedEx(c, {
      hint: `<p class="context">${blankOut(d.sentence, d.word)}</p><p class="muted">${esc(d.meaning)} · bắt đầu bằng “${esc(d.word.slice(0, 1))}”</p>`,
      accepted: [d.word, d.e.base_form]
    });
  },

  // Nghe câu rồi gõ từ còn thiếu
  dictation(c) {
    const { d } = c;
    typedEx(c, {
      hint: `<p class="muted">Nghe câu và gõ từ còn thiếu.</p><p class="context">${blankOut(d.sentence, d.word)}</p>`,
      label: 'Từ bạn nghe được', accepted: [d.word, d.e.base_form], audio: true
    });
  },

  recall(c) {
    const { d } = c;
    typedEx(c, {
      hint: `<div class="meaning">${esc(d.meaning)}</div>${d.e.emoji ? `<p style="font-size:1.6rem;margin:4px 0">${esc(d.e.emoji)}</p>` : ''}`,
      accepted: [d.word, d.e.base_form]
    });
  },

  // Đoán từ qua định nghĩa tiếng Anh (không qua tiếng Việt)
  defguess(c) {
    const { d } = c;
    typedEx(c, {
      hint: `<p class="muted">Định nghĩa${d.e.pos ? ' · ' + esc(d.e.pos) : ''}</p>
        <p class="context">${blankOut(d.e.definition_en, d.word)}</p>
        <p class="muted">bắt đầu bằng “${esc(d.word.slice(0, 1))}”</p>`,
      label: 'Từ nào có nghĩa này?', accepted: [d.word, d.e.base_form]
    });
  },

  // Đổi dạng từ: chọn đúng dạng (loại từ) cùng gốc trong các từ AI đã cung cấp
  family(c) {
    const { item, d } = c;
    const q = familyQuestion(item, d);
    choiceEx(c, {
      hint: `<p class="muted">Cùng một gốc, khác loại từ</p>
        <div class="word" style="font-size:1.5rem">${esc(d.word)}</div>
        <p class="muted">${POSVI[q.ownPos]} · ${esc(d.meaning)}</p>
        <p class="context">Từ nào dưới đây là <b>${POSVI[q.t.pos]}</b> cùng gốc với “${esc(d.word)}”?</p>`,
      options: q.options, answer: q.t.form,
      after: `<p class="muted"><b>Họ từ:</b> ${q.family.map(f => `${esc(f.form)} (${POSVI[f.pos]})`).join(' · ')}</p>`
    });
  },

  // Viết câu: chấm ngay sau khi bạn trả lời
  write({ d, head, finish }) {
    render(head + `
      <div class="card">
        <div class="meaning">${esc(d.meaning)}</div>
        <p class="muted">Viết một câu của riêng bạn có dùng “${esc(d.word)}”.</p>
        <textarea id="ans" autocapitalize="off"></textarea>
        <p class="muted kbdhint" style="margin-top:6px">Enter để chấm · Shift + Enter xuống dòng</p>
        <div class="row" style="margin-top:12px"><button class="primary" id="ok">Chấm câu</button></div>
      </div>`);
    $('#ans').focus();
    $('#ans').onkeydown = e => { if (enterOK(e) && !e.shiftKey) { e.preventDefault(); $('#ok').click(); } };
    $('#ok').onclick = once(async () => {
      const text = $('#ans').value.trim();
      if (!text) return;
      $('#ok').disabled = true; $('#ok').textContent = 'Đang chấm…';
      let fb = null;
      try { fb = (await gradeMany([{ word: d.word, meaning: d.meaning, text }])).get(0) || null; }
      catch { toast('Không chấm được, bạn tự đánh giá nhé'); }
      finish(fb ? [1, 2, 3, 4][clamp(+fb.score || 0, 0, 3)] : 3,
        fb ? `<p class="verdict ${fb.score >= 2 ? 'ok' : 'no'}">${esc(fb.feedback_vi)}</p>
              <p class="context">${esc(fb.corrected)}</p>` : '');
    });
  }
};

function showCard(item) {
  item._token = (item._token || 0) + 1;   // mỗi lần hiện thẻ có một mã riêng; commit chỉ nhận mỗi mã một lần
  const d = cardData(item);
  const started = Date.now();
  const head = `
    <div class="progress"><i style="width:${progressPct(0)}%"></i></div>
    <div class="bar"><span class="muted">${item._scored
      ? `${session.done + 1}/${session.total} · ${item.card.state === 'new' ? 'từ mới' : 'ôn tập'}`
      : `<span class="pill accent">Ôn thêm · không tính điểm</span> ${session.practiced ? '· đã ôn thêm ' + session.practiced : ''}`}</span>
    <button class="ghost" id="quit">Dừng</button></div>`;
  const finish = (rating, extra = '', metrics = null) => reveal(item, d, rating, extra, metrics);
  item._ex = pickExercise(item, d);
  EX[item._ex]({ item, d, head, started, finish });
  $('#quit').onclick = once(() => { flush(true); viewHome(); });
}

// Tách câu / tách phần chú thích để trình bày thành từng dòng ngắn, dễ quét mắt.
const sentencesOf = t => String(t || '').trim().split(/(?<=[.!?。])\s+/).filter(Boolean);
function splitNote(s) {
  const m = String(s).match(/^(.*?)\s*[(（]([^()（）]*)[)）]\s*$/);
  return m && m[1] ? { head: m[1].trim(), note: m[2].trim() } : { head: String(s).trim(), note: '' };
}
function splitExample(s) {
  const m = String(s).match(/^(.*\S)\s*\(([^()]+)\)\s*$/);
  return m && /[ăâđêôơưáàảãạéèẻẽẹíìỉĩịóòỏõọúùủũụýỳỷỹỵ]/i.test(m[2]) ? { en: m[1].trim(), vi: m[2].trim() } : { en: String(s).trim(), vi: '' };
}
// Tô đậm từ đang học trong câu ví dụ; nếu từ được chia khác dạng (ensemble / Ensembles) thì tô theo phần gốc.
function hl(text, word) {
  const plain = esc(text), exact = highlight(text, word);
  if (exact !== plain) return exact;
  const stem = String(word).replace(/(ing|ed|es|s|ly)$/i, '');
  if (stem.length >= 4) {
    try { return plain.replace(new RegExp('\\b(' + esc(stem).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\w*)', 'gi'), '<b>$1</b>'); } catch { /* bỏ qua */ }
  }
  return plain;
}
function examplesHTML(exs, word) {
  if (!exs.length) return '';
  return `<div class="exs">${exs.map(s => {
    const x = splitExample(s);
    return `<div class="ex"><div class="ex-en">${hl(x.en, word)}</div>${x.vi ? `<div class="ex-vi">${esc(x.vi)}</div>` : ''}</div>`;
  }).join('')}</div>`;
}
// Phần "Tìm hiểu thêm": mỗi mục một khối riêng, tiêu đề nhỏ, bỏ được bằng cách thu gọn (app nhớ lựa chọn).
function moreInfoHTML(e) {
  const use = sentencesOf(e.usage_note).slice(0, 4);
