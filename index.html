  const syns = listOf(e.synonyms).map(splitNote).filter(s => s.head);
  const fam = parseFamily(e.word_family);
  const famRaw = !fam.length ? String(e.word_family || '').trim() : '';
  const secs = [];
  if (use.length) secs.push(`<div class="sec"><div class="sec-t">Giải thích thêm</div><div class="use">${use.map(p => `<p>${esc(p)}</p>`).join('')}</div></div>`);
  if (syns.length) secs.push(`<div class="sec"><div class="sec-t">Gần nghĩa</div><div class="syn">${syns.map(s => `<b>${esc(s.head)}</b><span>${esc(s.note)}</span>`).join('')}</div></div>`);
  if (fam.length || famRaw) secs.push(`<div class="sec"><div class="sec-t">Họ từ</div><div class="fam">${
    fam.length ? fam.map(f => `<span class="pill">${esc(f.form)}<i>${POSVI[f.pos]}</i></span>`).join('') : `<span class="muted">${esc(famRaw)}</span>`}</div></div>`);
  if (e.mnemonic) secs.push(`<div class="sec"><div class="sec-t">Mẹo nhớ</div><p class="mn">${esc(e.mnemonic)}</p></div>`);
  if (!secs.length) return '';
  const open = localStorage.getItem('vocab.moreOpen') !== '0';
  return `<details class="more"${open ? ' open' : ''}><summary>Tìm hiểu thêm</summary>${secs.join('')}</details>`;
}

function reveal(item, d, rating, extra, metrics) {
  item._ms = metrics ? Math.round(metrics.ms) : '';
  const token = item._token;
  const e = d.e, colls = listOf(e.collocations), exs = listOf(e.examples);
  const differs = e.meaning_fixed && d.raw['Nghĩa tiếng Việt'] &&
    norm(e.meaning_fixed) !== norm(d.raw['Nghĩa tiếng Việt']);
  render(`
    <div class="progress"><i style="width:${progressPct(item._scored ? 1 : 0)}%"></i></div>
    <div class="card">
      <div class="word">${esc(d.word)} <button class="ghost" id="say">🔊</button></div>
      <div class="muted">${esc([e.ipa, e.romanization, e.pos].filter(Boolean).join(' · '))}</div>
      <div class="meaning" style="margin-top:8px">${esc(d.meaning)} ${esc(e.emoji || '')}</div>
      ${e.hanviet ? `<p class="muted">Hán Việt: ${esc(e.hanviet)}</p>` : ''}
      ${differs ? `<p class="pill warn">AI gợi ý nghĩa khác với ghi chú của bạn: “${esc(d.raw['Nghĩa tiếng Việt'])}”</p>` : ''}
      ${extra}
      ${d.raw['Câu / Ngữ cảnh'] ? `<p class="context">${highlight(d.raw['Câu / Ngữ cảnh'], d.word)}</p>` : ''}
      ${colls.length ? `<div class="pills">${colls.map(c => `<span class="pill">${esc(c)}</span>`).join('')}</div>` : ''}
      ${examplesHTML(exs, d.word)}
      ${moreInfoHTML(e)}
      ${cfg.geminiKey ? `<div class="meta"><span>${e.refreshed_at ? `AI làm mới ${new Date(e.refreshed_at).toLocaleDateString('vi-VN')}${+e.refresh_count ? ` · lần ${e.refresh_count}` : ''}` : 'Chưa làm mới'}</span><button class="ghost" id="refreshNow">✨ Làm mới</button></div>` : ''}
      ${d.raw['Nguồn (URL)'] ? `<p class="src">Nguồn: <a href="${esc(d.raw['Nguồn (URL)'])}" target="_blank" rel="noopener">${esc(d.raw['Tiêu đề trang'] || d.raw['Nguồn (URL)'])}</a></p>` : ''}
      <div class="auto">
        <span>
          <span class="label">App chấm</span>
          <span class="value">${RATING[rating]}</span>
          <span class="muted"> · ${esc(ratingReason(metrics, rating))}${item._scored ? '' : ' · ôn thêm, không đổi lịch ôn'}</span>
        </span>
        <button class="primary" id="next">Tiếp tục</button>
      </div>
      <div class="rate">
        ${[[1, 'Quên', 'làm lại'], [2, 'Khó', 'chật vật'], [3, 'Được', 'nhớ ra'], [4, 'Dễ', 'nhớ ngay']]
          .map(([g, t, s]) => `<button data-g="${g}" class="${g === rating ? 'primary' : ''}">${t}<b>${s}</b></button>`).join('')}
      </div>
      <p class="muted kbdhint">Enter: chấp nhận “${RATING[rating]}” và tiếp tục · 1–4: chọn mức khác rồi tiếp tục</p>
    </div>`);
  // Màn hình đáp án vừa thay chỗ nút vừa bấm, nên chặn lâu hơn một chút.
  arm(700);
  $('#next').onclick = once(() => commit(item, d, rating, token));
  $('#say').onclick = () => speak(d.word, d.lang);
  const rn = $('#refreshNow');
  if (rn) rn.onclick = async () => {
    rn.disabled = true; rn.textContent = 'Đang làm mới…';
    try { const done = await refreshNow(d.raw); rn.textContent = done.length > 1 ? `Đã làm mới ${done.length} từ trong một lần gọi` : 'Đã làm mới, lần gặp sau sẽ thấy'; flush(true); }
    catch (err) { rn.disabled = false; rn.textContent = '✨ Làm mới'; toast('Không làm mới được: ' + err.message, 3500); }
  };
  const det = $('details.more');
  if (det) det.ontoggle = () => localStorage.setItem('vocab.moreOpen', det.open ? '1' : '0');
  if (DB.settings.autoplay !== 'false') speak(d.word, d.lang);
  app.querySelectorAll('.rate button').forEach(b => b.onclick = once(() => commit(item, d, +b.dataset.g, token)));
}

function progressPct(extra) {
  if (!session.total) return 100;
  return Math.min(100, ((session.done + extra) / session.total) * 100);
}

async function commit(item, d, g, token) {
  // Chặn chấm trùng: dù bấm dồn hay phím lặp, một lần hiện thẻ chỉ tính điểm một lần.
  if (token !== undefined && item._done === token) return;
  item._done = token;
  applyResult(item, d, g);
  nextCard();
}

// Ghi kết quả một thẻ: log, lịch ôn (nếu tính điểm), bộ đếm; không chuyển màn hình.
function applyResult(item, d, g) {
  const scored = item._scored !== false;
  const stageBefore = item.card.stage ?? 0;
  enqueue('appendLog', {
    ts: nowISO(), word_id: item.card.word_id,
    exercise: item._ex || ['choice', 'cloze', 'recall', 'write'][stageBefore],
    rating: g, correct: g > 1 ? 'true' : 'false', answer: '', ms: item._ms ?? '',
    mode: scored ? 'scored' : 'practice'
  });

  if (scored) {
    const updated = schedule(item.card, g);
    if (item.card.state === 'new') dailyStat('new_' + d.lang, 1);
    dailyStat('reviews', 1);
    persistCard(updated);
    item.card = updated;
    session.done++;
    session.recent.push(item.raw.word_id);
    // Thẻ chưa qua bước học ngắn quay lại hàng đợi; sẽ hiện lại khi tới giờ của bước đó.
    if (isLearning(updated)) { session.queue.push(item); session.total++; }
  } else {
    // Ôn thêm: KHÔNG gọi schedule, KHÔNG ghi Progress → lịch ôn của từ giữ nguyên.
    dailyStat('practice', 1);
    session.practiced++;
    session.recent.push(item.raw.word_id);
    if (g === 1) session.practice.splice(Math.min(3, session.practice.length), 0, item); // quên thì gặp lại sau vài thẻ
  }
  session.current = null;
  scheduleRefresh([item]);   // xếp thẻ vừa làm xong vào danh sách chờ làm mới (đủ 4 từ mới gọi AI một lần)
  flush();          // gửi nền, không chờ
}

/* ============================ HỖ TRỢ HIỂN THỊ ============================ */
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
const safeList = s => { try { const v = JSON.parse(s || '[]'); return Array.isArray(v) ? v : []; } catch { return []; } };
const rx = w => new RegExp(`(${w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
const highlight = (text, word) => esc(text).replace(rx(esc(word)), '<b>$1</b>');
const blankOut = (text, word) => esc(text).replace(rx(esc(word)), '<span class="blank">______</span>');

/* ============================ BÀN PHÍM ============================ */
let lastComp = 0;
document.addEventListener('compositionend', () => { lastComp = Date.now(); }, true);
// Enter hợp lệ: không giữ phím, không đang gõ dấu/Hangul (Enter chốt chữ không được tính).
const enterOK = e => e.key === 'Enter' && !e.repeat && !e.isComposing && e.keyCode !== 229 && Date.now() - lastComp > 60;

function kbdClick(el) {
  if (!el || Date.now() - renderAt < 250) return false; // chặn phím lặp ngay sau khi vừa đổi màn hình
  guardUntil = 0;                                       // bàn phím không cần khóa chống chạm nhầm của chuột
  el.click();
  return true;
}
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.repeat || e.isComposing) return;
  const tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'BUTTON' || tag === 'A') return;
  if (e.key === 'Enter') {
    if (kbdClick($('#next') || $('#more'))) e.preventDefault();
  } else if (/^[1-4]$/.test(e.key)) {
    const rate = $(`.rate button[data-g="${e.key}"]`);
    if (rate) { if (kbdClick(rate)) e.preventDefault(); return; }
    const choice = app.querySelectorAll('.choice')[+e.key - 1];
    if (choice && kbdClick(choice)) e.preventDefault();
  }
});

/* ============================ THỐNG KÊ ============================ */
let statsLang = 'all', statsOpen = false, statsNote = '';
const tzMin = () => -new Date().getTimezoneOffset();
const dayKey = ms => new Date(ms + tzMin() * 60000).toISOString().slice(0, 10);
const WD = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];

// Gom số liệu lịch sử từ ReviewLog (server) cho các ngôn ngữ đang chọn.
function historyDay(key, langs) {
  const out = { n: 0, ok: 0, r: [0, 0, 0, 0], ms: 0, msN: 0, p: 0, pok: 0 };
  const day = DB.review && DB.review.days && DB.review.days[key];
  if (!day) return out;
  langs.forEach(l => {
    const o = day[l]; if (!o) return;
    out.n += o.n; out.ok += o.ok; out.ms += o.ms; out.msN += o.msN;
    out.p += o.p || 0; out.pok += o.pok || 0;
    o.r.forEach((v, i) => out.r[i] += v);
  });
  return out;
}

function computeStats(lang) {
  const langs = lang === 'all' ? ['en', 'ko'] : [lang];
  const now = Date.now();
  const rows = DB.raw.filter(r => langs.includes(r['Ngôn ngữ'] || 'en'));
  const cards = rows.map(r => ({ raw: r, card: cardOf(r) })).filter(x => x.card.suspended !== 'true');
  const c = x => x.card;

  // Trạng thái từ vựng
  const nw = cards.filter(x => c(x).state === 'new').length;
  const learning = cards.filter(x => c(x).state === 'learning' || c(x).state === 'relearning').length;
  const review = cards.filter(x => c(x).state === 'review');
  const mature = review.filter(x => c(x).S >= 21).length;
  const young = review.length - mature;
  const avgS = review.length ? review.reduce((a, x) => a + c(x).S, 0) / review.length : 0;

  // Lịch ôn 7 ngày tới (thẻ quá hạn tính vào hôm nay)
  const today = dayKey(now);
  const forecast = Array.from({ length: 7 }, (_, i) => {
    const k = dayKey(now + i * 864e5);
    return { key: k, n: 0, label: i === 0 ? 'Nay' : i === 1 ? 'Mai' : WD[new Date(k + 'T00:00:00Z').getUTCDay()], hl: i === 0 };
  });
  cards.filter(x => c(x).state !== 'new').forEach(x => {
    let k = dayKey(new Date(c(x).due).getTime());
    if (k < today) k = today;
    const f = forecast.find(f => f.key === k);
    if (f) f.n++;
  });

  // Lịch sử 14 ngày
  const hasHistory = !!DB.review;
  const local = JSON.parse(localStorage.getItem(LS.stats) || '{}');
  const hist = Array.from({ length: 14 }, (_, i) => {
    const k = dayKey(now - (13 - i) * 864e5);
    const o = hasHistory ? historyDay(k, langs) : { n: (local[k] && local[k].reviews) || 0, p: (local[k] && local[k].practice) || 0 };
    const [, m, d] = k.split('-');
    return { key: k, n: o.n + o.p, p: o.p, label: `${+d}/${+m}`, hl: k === today };
  });

  // 30 ngày: tỷ lệ nhớ, phân bố mức đánh giá, thời gian trả lời
  const agg = { n: 0, ok: 0, r: [0, 0, 0, 0], ms: 0, msN: 0, p: 0, pok: 0 };
  for (let i = 0; i < 30; i++) {
    const o = historyDay(dayKey(now - i * 864e5), langs);
    agg.n += o.n; agg.ok += o.ok; agg.ms += o.ms; agg.msN += o.msN;
    agg.p += o.p; agg.pok += o.pok;
    o.r.forEach((v, j) => agg.r[j] += v);
  }

  // Chuỗi ngày học (tính trên cả hai ngôn ngữ): nếu hôm nay chưa học thì tính từ hôm qua
  let streak = 0;
  if (hasHistory) {
    const any = k => { const o = historyDay(k, ['en', 'ko']); return o.n + o.p > 0; };
    let i = any(today) ? 0 : 1;
    while (any(dayKey(now - i * 864e5))) { streak++; i++; }
  } else {
    const any = k => ((local[k] || {}).reviews || 0) + ((local[k] || {}).practice || 0) > 0;
    let i = any(today) ? 0 : 1;
    while (any(dayKey(now - i * 864e5))) { streak++; i++; }
  }

  // Từ hay quên nhất: đếm thật số lần trả lời "Quên" trong ReviewLog (server đã lọc dòng trùng / bấm dồn)
  const W = (DB.review && DB.review.words) || null;
  const lapsy = W ? cards.map(x => ({ ...x, st: W[x.raw.word_id] }))
    .filter(x => x.st && x.st.fail > 0)
    .sort((a, b) => b.st.fail - a.st.fail || (b.st.fail / b.st.n) - (a.st.fail / a.st.n) || String(b.st.last_fail).localeCompare(String(a.st.last_fail)))
    .slice(0, 10) : [];
  const lapsyReal = !!W;

  return {
    total: cards.length, nw, learning, young, mature, avgS, forecast, hist, agg, streak, lapsy, lapsyReal,
    todayN: hist[hist.length - 1].n, todayP: hist[hist.length - 1].p, hasHistory
  };
}

function barChart(items) {
  const max = Math.max(1, ...items.map(i => i.n));
  return `<div class="bars">${items.map(i => `
    <div class="col"><span class="v">${i.n || ''}</span>
    <i class="${i.hl ? 'hl' : ''}" style="height:${i.n ? Math.max(6, (i.n / max) * 84) : 3}px">${i.p ? `<em style="height:${(i.p / i.n) * 100}%"></em>` : ''}</i>
    <span class="l">${i.label}</span></div>`).join('')}</div>`;
}

function statsHTML(lang, note) {
  const s = computeStats(lang);
  const target = Math.round((+DB.settings.target_retention || 0.9) * 100);
  const pct = s.agg.n ? Math.round((s.agg.ok / s.agg.n) * 100) : null;
  const avgSec = s.agg.msN ? (s.agg.ms / s.agg.msN / 1000).toFixed(1) : null;
  const names = ['Quên', 'Khó', 'Được', 'Dễ'];
  const colors = ['#f43f5e', '#f59e0b', '#0a84ff', '#10b981'];
  const rMax = Math.max(1, ...s.agg.r);
  const seg = [['all', 'Tất cả'], ['en', 'Tiếng Anh'], ['ko', 'Tiếng Hàn']]
    .map(([k, t]) => `<button data-lang="${k}" class="${k === lang ? 'on' : ''}">${t}</button>`).join('');
  const stack = [['#a78bfa', s.nw, 'Chưa học'], ['#f59e0b', s.learning, 'Đang học'],
                 ['#6ea8fe', s.young, 'Đang nhớ'], ['#10b981', s.mature, 'Nhớ vững']];
  const tot = Math.max(1, s.total);

  return `
    <div class="bar"><h1>Thống kê</h1><button class="ghost" id="back">Xong</button></div>
    <div class="seg">${seg}</div>
    ${note ? `<p class="pill warn" style="display:inline-block;margin:0 0 12px">${esc(note)}</p>` : ''}
    ${!s.hasHistory ? `<p class="pill warn" style="display:inline-block;margin:0 0 12px">Chưa có lịch sử từ sheet. Dán Code_v3.gs và deploy bản mới để xem đủ số liệu; hiện chỉ có số lượt ôn trên máy này.</p>` : ''}

    <div class="tiles">
      <div class="tile"><div class="v">${s.todayN}</div><div class="t">Lượt ôn hôm nay</div>${s.todayP ? `<div class="s">gồm ${s.todayP} lượt ôn thêm</div>` : ''}</div>
      <div class="tile"><div class="v">${s.streak}</div><div class="t">Chuỗi ngày học</div><div class="s">ngày liên tiếp</div></div>
      <div class="tile"><div class="v">${pct === null ? '—' : pct + '%'}</div><div class="t">Nhớ đúng, 30 ngày</div><div class="s">mục tiêu ${target}%</div></div>
      <div class="tile"><div class="v">${s.total}</div><div class="t">Từ đang học</div><div class="s">${s.mature} từ nhớ vững</div></div>
    </div>

    <div class="card">
      <h3>14 ngày gần đây</h3>
      ${barChart(s.hist)}
      <p class="muted"><span class="dot" style="background:#0a84ff"></span>Ôn đúng hạn <span class="dot" style="background:#a78bfa;margin-left:12px"></span>Ôn thêm${s.hasHistory ? '' : ' · chỉ trên máy này'}</p>
    </div>

    <div class="card">
      <h3>Mức đánh giá, 30 ngày</h3>
      ${s.agg.n ? names.map((n, i) => `
        <div class="hrow"><span>${n}</span>
          <span class="track"><i style="width:${(s.agg.r[i] / rMax) * 100}%;background:${colors[i]}"></i></span>
          <span class="n">${s.agg.r[i]}</span></div>`).join('') : '<p class="muted">Chưa có dữ liệu.</p>'}
      ${avgSec ? `<p class="muted">Thời gian trả lời trung bình ${avgSec} giây · Chỉ tính lượt ôn đúng hạn; tỷ lệ nhớ đúng gồm cả thẻ mới nên thường thấp hơn mục tiêu một chút.</p>` : ''}
      ${s.agg.p ? `<p class="muted">Ôn thêm 30 ngày: ${s.agg.p} lượt, đúng ${Math.round((s.agg.pok / s.agg.p) * 100)}%. Phần này không tính vào lịch ôn.</p>` : ''}
    </div>

    <div class="card">
      <h3>Trạng thái từ vựng</h3>
      <div class="stack">${stack.map(([col, n]) => `<i style="width:${(n / tot) * 100}%;background:${col}"></i>`).join('')}</div>
      <div class="legend">${stack.map(([col, n, t]) => `<span><span class="dot" style="background:${col}"></span>${t} <b>${n}</b></span>`).join('')}</div>
      <p class="muted" style="margin-top:12px">${s.avgS ? `Độ bền trung bình ${s.avgS < 10 ? s.avgS.toFixed(1) : Math.round(s.avgS)} ngày: sau chừng đó ngày, khả năng nhớ giảm còn khoảng 90%.` : 'Chưa có từ nào qua vòng ôn đầu tiên.'} “Nhớ vững” là độ bền từ 21 ngày.</p>
    </div>

    <div class="card">
      <h3>Lịch ôn 7 ngày tới</h3>
      ${barChart(s.forecast)}
      <p class="muted">Thẻ quá hạn được tính vào hôm nay</p>
    </div>

    <div class="card">
      <h3>Từ hay quên nhất</h3>
      <p class="muted">Đếm từ lịch sử trả lời thật trong 120 ngày (gồm cả ôn thêm, không tính truyện ngắn).</p>
      ${!s.lapsyReal ? '<p class="pill warn" style="display:inline-block">Cần dán Code_v7.gs và deploy bản mới để xem mục này.</p>'
        : s.lapsy.length ? s.lapsy.map(x => {
        const e = DB.enrichment[x.raw.word_id] || {};
        const pct = Math.round((x.st.fail / x.st.n) * 100);
        const when = x.st.last_fail ? new Date(x.st.last_fail).toLocaleDateString('vi-VN') : '';
        return `<div class="li"><span><span class="w">${esc(x.raw['Từ vựng'])}</span><span class="m">${esc(e.meaning_fixed || x.raw['Nghĩa tiếng Việt'] || '')}</span>
          <br><span class="muted">quên ${x.st.fail}/${x.st.n} lần làm bài · lần quên gần nhất ${when}</span></span><span class="c">${pct}%</span></div>`;
      }).join('') : '<p class="muted">Chưa có từ nào bị quên. Cứ thế phát huy.</p>'}
      ${s.lapsy.length && lang !== 'all'
        ? `<div class="row" style="margin-top:14px"><button class="primary" id="practice">Luyện riêng ${s.lapsy.length} từ này</button></div>`
        : (s.lapsy.length ? '<p class="muted" style="margin-top:10px">Chọn Tiếng Anh hoặc Tiếng Hàn để luyện riêng nhóm từ này.</p>' : '')}
    </div>`;
}

function drawStats() {
  if (!statsOpen) return;
  render(statsHTML(statsLang, statsNote));
  $('#back').onclick = once(() => { statsOpen = false; viewHome(); });
  app.querySelectorAll('.seg button').forEach(b => b.onclick = once(() => { statsLang = b.dataset.lang; drawStats(); }));
  const p = $('#practice');
  if (p) p.onclick = once(() => {
    const ids = computeStats(statsLang).lapsy.map(x => x.raw.word_id);
    statsOpen = false;
    startCustom(statsLang, ids);
  });
}

async function viewStats() {
  statsOpen = true; statsNote = '';
  render(`<div class="bar"><h1>Thống kê</h1><button class="ghost" id="back">Xong</button></div>
    <div class="card"><p class="muted">Đang cập nhật số liệu…</p></div>`);
  $('#back').onclick = once(() => { statsOpen = false; viewHome(); });
  await flush(true);
  if (!queueRead().length) {
    try { await loadAll(); } catch (e) { statsNote = 'Không tải được dữ liệu mới, đang hiện số liệu đã có.'; }
  } else {
    statsNote = `${queueRead().length} thay đổi chưa gửi lên sheet nên số liệu có thể chưa mới.`;
  }
  drawStats();
}

function startCustom(lang, ids) {
  const now = Date.now();
  const items = ids.map(id => DB.raw.find(r => r.word_id === id)).filter(Boolean)
    .map(raw => ({ raw, card: cardOf(raw) }));
  if (!items.length) { viewHome(); return; }
  const isDue = x => new Date(x.card.due).getTime() <= now;
  session = newSession(lang, items.filter(isDue), { custom: true });
  session.practice = items.filter(x => !isDue(x)).map(x => ({ ...x, practice: true }));
  nextCard();
}

/* ============================ ÔN BẰNG TRUYỆN NGẮN ============================ */
// AI viết một truyện ngắn tự nhiên dùng các từ bạn vừa học, kèm bản dịch và 3 câu hỏi đọc hiểu.
// Đây là ôn thêm: chỉ ghi log (mode = practice), không đổi lịch ôn của từ.
let story = null;
const LANG_NAME = { en: 'tiếng Anh', ko: 'tiếng Hàn' };

function learnedCards(lang) {
  return DB.raw.filter(r => (r['Ngôn ngữ'] || 'en') === lang)
    .map(r => ({ raw: r, card: cardOf(r) }))
    .filter(x => x.card.suspended !== 'true' && x.card.state !== 'new');
}

// Ưu tiên từ vừa ôn trong phiên; không có thì lấy từ ôn trong 48 giờ qua; thiếu thì bù bằng từ sắp quên nhất.
function pickStoryWords(lang, preferIds = []) {
  const all = learnedCards(lang);
  const max = lang === 'ko' ? 6 : 8;
  const byId = Object.fromEntries(all.map(x => [x.raw.word_id, x]));
  let picked = preferIds.map(id => byId[id]).filter(Boolean);
  if (picked.length < 3) {
    const since = Date.now() - 48 * 3600e3;
    picked = all.filter(x => x.card.last_review && new Date(x.card.last_review).getTime() >= since)
      .sort((a, b) => new Date(b.card.last_review) - new Date(a.card.last_review));
  }
  if (picked.length < 5) {
    const have = new Set(picked.map(x => x.raw.word_id));
    const rest = all.filter(x => !have.has(x.raw.word_id)).map(x => {
      const el = x.card.last_review ? days(new Date(), x.card.last_review) : 0;
      return { ...x, R: x.card.S > 0 ? retrievability(el, x.card.S) : 0 };
    }).sort((a, b) => a.R - b.R);
    picked = picked.concat(rest.slice(0, 5 - picked.length));
  }
  return shuffle(picked.slice(0, max));
}

const STORY_SCHEMA = {
  type: 'OBJECT',
  properties: {
    title: { type: 'STRING' },
    story: { type: 'STRING' },
    translation_vi: { type: 'STRING' },
    words: { type: 'ARRAY', items: { type: 'OBJECT', properties: {
      i: { type: 'INTEGER' }, form: { type: 'STRING' }, meaning_vi: { type: 'STRING' } }, required: ['i', 'form', 'meaning_vi'] } },
    questions: { type: 'ARRAY', items: { type: 'OBJECT', properties: {
      q: { type: 'STRING' }, options: { type: 'ARRAY', items: { type: 'STRING' } },
      answer: { type: 'INTEGER' }, explain_vi: { type: 'STRING' } }, required: ['q', 'options', 'answer', 'explain_vi'] } }
  },
  required: ['title', 'story', 'translation_vi', 'words', 'questions']
};

function storyPrompt(lang, items) {
  const list = items.map((x, i) => {
    const e = DB.enrichment[x.raw.word_id] || {};
    const meaning = e.meaning_fixed || x.raw['Nghĩa tiếng Việt'] || '';
    const ctx = (x.raw['Câu / Ngữ cảnh'] || '').slice(0, 220);
    return `${i}. "${x.raw['Từ vựng']}" — nghĩa: ${meaning}${ctx ? ` — ngữ cảnh gốc: "${ctx}"` : ''}`;
  }).join('\n');
  const level = lang === 'ko'
    ? 'trình độ sơ cấp đến trung cấp thấp (TOPIK 2–3), câu ngắn, dùng đuôi lịch sự 해요체, 80–130 âm tiết mỗi đoạn, tổng 3–4 đoạn ngắn'
    : 'trình độ B1, câu ngắn và rõ, giọng văn đời thường như người bản xứ kể chuyện, 140–200 từ, 3–4 đoạn';
  return `Bạn viết truyện ngắn giúp một người Việt ôn từ vựng ${LANG_NAME[lang]}.

Các từ cần dùng (số thứ tự ở đầu là chỉ số i):
${list}

Yêu cầu:
- Viết MỘT câu chuyện liền mạch bằng ${LANG_NAME[lang]}, ${level}. Không dùng từ ngữ hoa mỹ, hiếm gặp hay cấu trúc phức tạp ngoài các từ cần ôn.
- Dùng MỖI từ trong danh sách đúng một lần, với ĐÚNG nghĩa như trong ngữ cảnh gốc. Được chia/biến đổi hình thái cho đúng ngữ pháp (số nhiều, thì, đuôi câu...).
- Chọn bối cảnh đời thường phù hợp với nghĩa của các từ (ví dụ thời trang, âm nhạc, gia đình, công việc...). Mỗi từ phải xuất hiện ở chỗ người bản xứ thật sự sẽ dùng nó, không gượng ép.
- Trong "story", đánh dấu mỗi từ cần ôn theo dạng [[dạng xuất hiện trong câu|i]], ví dụ [[ensembles|2]]. Không đánh dấu từ nào khác. Ngắt đoạn bằng một dòng trống.
- "translation_vi": bản dịch tiếng Việt tự nhiên của cả truyện, giữ nguyên cách ngắt đoạn, không có dấu [[ ]].
- "words": mỗi từ một mục { i, form: dạng xuất hiện trong truyện, meaning_vi: nghĩa ngắn gọn trong câu đó }.
- "questions": đúng 3 câu hỏi đọc hiểu bằng ${LANG_NAME[lang]} đơn giản, mỗi câu 4 lựa chọn ngắn, "answer" là chỉ số (0–3) của đáp án đúng, "explain_vi" giải thích ngắn bằng tiếng Việt. Ít nhất 2 câu hỏi phải cần hiểu nghĩa của từ cần ôn mới trả lời được.
- "title": tiêu đề ngắn bằng ${LANG_NAME[lang]}.`;
}

async function startStory(lang, preferIds = []) {
  if (!cfg.geminiKey) { toast('Cần Gemini API key: vào Cài đặt → Đổi kết nối.', 3500); return; }
  const items = pickStoryWords(lang, preferIds);
  if (items.length < 3) { toast('Cần ít nhất 3 từ đã học để viết truyện.'); return; }
  const token = {};
  story = { token, lang, items, data: null, looked: new Set(), answered: {}, showTr: false, ctrl: new AbortController() };
  render(`<div class="bar"><h1>Truyện ngắn</h1><button class="ghost" id="back">Xong</button></div>
    <div class="card"><p class="muted">Đang viết truyện với ${items.length} từ: ${items.map(x => esc(x.raw['Từ vựng'])).join(', ')}…</p></div>`);
  $('#back').onclick = once(() => { if (story && story.ctrl) story.ctrl.abort(); story = null; viewHome(); });
  try {
    const { data } = await callGemini({ feature: 'story', prompt: storyPrompt(lang, items), schema: STORY_SCHEMA, signal: story.ctrl.signal });
    if (!story || story.token !== token) return;          // người dùng đã rời màn hình
    story.data = data;
    drawStory();
  } catch (e) {
    if (e.aborted || !story || story.token !== token) return;
    render(`<div class="bar"><h1>Truyện ngắn</h1><button class="ghost" id="back">Xong</button></div>
      <div class="card"><p class="verdict no">Không viết được truyện: ${esc(e.message)}</p>
      <div class="row"><button class="primary" id="retry">Thử lại</button></div></div>`);
    $('#back').onclick = once(() => { story = null; viewHome(); });
    $('#retry').onclick = once(() => { startStory(lang, preferIds); });
  }
}

function storyParagraphs(text, marked) {
  return String(text || '').split(/\n\s*\n/).map(p => p.trim()).filter(Boolean).map(p => {
    let html = esc(p);
    if (marked) html = html.replace(/\[\[([^|\]]+)\|(\d+)\]\]/g, (_, form, i) => `<button class="tw" data-i="${+i}">${form}</button>`)
                           .replace(/\[\[([^\]]+)\]\]/g, (_, form) => `<button class="tw" data-i="-1">${form}</button>`);
    return `<p>${html}</p>`;
  }).join('');
}
const plainStory = t => String(t || '').replace(/\[\[([^|\]]+)(\|\d+)?\]\]/g, '$1');

function drawStory() {
  const s = story, d = s.data;
  const qs = (d.questions || []).slice(0, 3);
  render(`
    <div class="bar"><h1>Truyện ngắn</h1><button class="ghost" id="back">Xong</button></div>
    <div class="card story">
      <h2>${esc(d.title)}</h2>
      <p class="muted">Chạm vào từ được tô màu để xem nghĩa. Truyện này không tính vào lịch ôn.</p>
      <div class="body" style="margin-top:14px">${storyParagraphs(d.story, true)}</div>
      <div class="gloss" id="gloss">Chạm vào một từ được tô màu để xem nghĩa.</div>
      <div class="row" style="margin-top:14px">
        <button id="listen">🔊 Nghe</button>
        <button id="tr">${s.showTr ? 'Ẩn bản dịch' : 'Xem bản dịch'}</button>
        <button id="again">Truyện khác</button>
      </div>
      <div class="tr ${s.showTr ? '' : 'hide'}" id="trBox" style="margin-top:14px">${storyParagraphs(d.translation_vi, false)}</div>
    </div>
    <div class="card">
      <h3>Đọc hiểu</h3>
      ${qs.map((q, qi) => `
        <p class="q">${qi + 1}. ${esc(q.q)}</p>
        ${(q.options || []).map((o, oi) => {
          const a = s.answered[qi];
          const cls = a === undefined ? '' : oi === q.answer ? 'right' : (oi === a ? 'wrong' : '');
          return `<button class="choice ${cls}" data-q="${qi}" data-o="${oi}">${esc(o)}</button>`;
        }).join('')}
        ${s.answered[qi] !== undefined ? `<p class="verdict ${s.answered[qi] === q.answer ? 'ok' : 'no'}">${s.answered[qi] === q.answer ? 'Đúng.' : 'Chưa đúng.'} <span class="muted">${esc(q.explain_vi)}</span></p>` : ''}
      `).join('')}
      <div class="row" style="margin-top:16px"><button class="primary" id="done">Xong, về trang chủ</button></div>
    </div>`);

  const wordOf = i => {
    const w = (d.words || []).find(x => x.i === i);
    const item = s.items[i];
    return { w, item };
  };
  app.querySelectorAll('button.tw').forEach(b => b.onclick = () => {
    app.querySelectorAll('button.tw.on').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    const i = +b.dataset.i;
    const { w, item } = wordOf(i);
    if (item) s.looked.add(i);
    const base = item ? item.raw['Từ vựng'] : b.textContent;
    const meaning = (w && w.meaning_vi) || (item && ((DB.enrichment[item.raw.word_id] || {}).meaning_fixed || item.raw['Nghĩa tiếng Việt'])) || '';
    $('#gloss').innerHTML = `<b>${esc(b.textContent)}</b>${base && norm(base) !== norm(b.textContent) ? ` (từ gốc: ${esc(base)})` : ''} — ${esc(meaning)}`;
    speak(b.textContent, s.lang);
  });
  $('#listen').onclick = () => {
    if (window.speechSynthesis && speechSynthesis.speaking) { speechSynthesis.cancel(); return; }
    speak(plainStory(d.story), s.lang);
  };
  $('#tr').onclick = () => { s.showTr = !s.showTr; $('#trBox').classList.toggle('hide', !s.showTr); $('#tr').textContent = s.showTr ? 'Ẩn bản dịch' : 'Xem bản dịch'; };
  $('#again').onclick = once(() => { finishStory(); startStory(s.lang, s.items.map(x => x.raw.word_id)); });
  app.querySelectorAll('.choice[data-q]').forEach(b => b.onclick = () => {
    const qi = +b.dataset.q;
    if (s.answered[qi] !== undefined) return;
    s.answered[qi] = +b.dataset.o;
    const y = window.scrollY; drawStory(); window.scrollTo(0, y);
  });
  $('#back').onclick = once(() => { finishStory(); viewHome(); });
  $('#done').onclick = once(() => { finishStory(); viewHome(); });
}

// Ghi nhận đã gặp từ trong truyện: phải tra nghĩa → "Khó", không tra → "Được". Chỉ là log ôn thêm.
function finishStory() {
  const s = story;
  story = null;
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (!s || !s.data) return;
  const t = Date.now();
  s.items.forEach((x, i) => {
    const g = s.looked.has(i) ? 2 : 3;
    enqueue('appendLog', {
      ts: new Date(t + i).toISOString(), word_id: x.raw.word_id, exercise: 'story',
      rating: g, correct: 'true', answer: '', ms: '', mode: 'practice'
    });
  });
  dailyStat('practice', s.items.length);
  flush(true);
}

/* ============================ LUYỆN THÊM: CÁC BÀI TẬP RIÊNG ============================
   Tất cả là ôn thêm: chỉ ghi log (mode = practice), không đổi lịch ôn của từ. */
let act = null, practiceLang = 'en';
function endAct() {
  if (act && act.ctrl) act.ctrl.abort();             // hủy request AI đang chờ
  if (act && act.timer) clearInterval(act.timer);
  act = null;
  if (typeof window !== 'undefined' && window.speechSynthesis) speechSynthesis.cancel();
}
const meaningOf = x => (DB.enrichment[x.raw.word_id] || {}).meaning_fixed || x.raw['Nghĩa tiếng Việt'] || '';
const fmtTime = ms => { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const actBar = title => `<div class="bar"><h1>${esc(title)}</h1><button class="ghost" id="back">Xong</button></div>`;
const wireBack = () => { const b = $('#back'); if (b) b.onclick = once(() => { endAct(); viewHome(); }); };

// Các từ đã học, sắp theo khả năng nhớ thấp nhất (sắp quên nhất) lên trước.
function learnedPool(lang, filter = () => true) {
  return learnedCards(lang).filter(filter).map(x => {
    const el = x.card.last_review ? days(new Date(), x.card.last_review) : 0;
    return { ...x, R: x.card.S > 0 ? retrievability(el, x.card.S) : 0 };
  }).sort((a, b) => a.R - b.R);
}
// Lấy từ trong nhóm sắp quên nhất rồi xáo, để mỗi lần chơi không giống hệt nhau.
function pickPractice(lang, n, filter) {
  return shuffle(learnedPool(lang, filter).slice(0, n * 2)).slice(0, n);
}
function logPractice(rows) {
  const t = Date.now();
  rows.forEach((r, i) => enqueue('appendLog', {
    ts: new Date(t + i).toISOString(), word_id: r.word_id, exercise: r.exercise,
    rating: r.rating, correct: r.rating > 1 ? 'true' : 'false', answer: '', ms: r.ms ?? '', mode: 'practice'
  }));
  dailyStat('practice', rows.length);
  flush();
}
function actLoading(title, text) {
  render(actBar(title) + `<div class="card"><p class="muted">${esc(text)}</p></div>`);
  wireBack();
}
function actError(title, msg, retry, skip) {
  render(actBar(title) + `<div class="card"><p class="verdict no">${esc(msg)}</p><div class="row"><button class="primary" id="retry">Thử lại</button>${skip ? '<button id="skip">Bỏ qua từ này</button>' : ''}</div></div>`);
  wireBack();
  $('#retry').onclick = once(() => { retry(); });
  if (skip) $('#skip').onclick = once(() => { skip(); });
}
function actSummary(title, headline, lines, again) {
  render(actBar(title) + `<div class="card"><h2>${esc(headline)}</h2>
    ${lines.map(l => `<p class="muted">${l}</p>`).join('')}
    <p class="muted">Chỉ ghi lại để thống kê, không đổi lịch ôn của từ.</p>
    <div class="row" style="margin-top:12px"><button class="primary" id="again">Chơi tiếp</button><button id="home2">Về trang chủ</button></div></div>`);
  wireBack();
  $('#again').onclick = once(() => { again(); });
  $('#home2').onclick = once(() => { endAct(); viewHome(); });
}
const rateOf = (ok, ms) => autoRating({ mode: 'choice', exact: ok, errorRatio: ok ? 0 : 1, ms });

/* ----- Trang chủ: khối "Luyện thêm" ----- */
const examplePairs = e => listOf(e.examples).map(s => {
  const m = s.match(/^(.*\S)\s*\(([^()]+)\)\s*$/);
  return m ? { en: m[1].trim(), vi: m[2].trim() } : null;
}).filter(x => x && /[ăâđêôơưáàảãạéèẻẽẹíìỉĩịóòỏõọúùủũụýỳỷỹỵ]/i.test(x.vi));
const translatePool = lang => learnedPool(lang, x => examplePairs(DB.enrichment[x.raw.word_id] || {}).length > 0);
const hanvietOf = x => String((DB.enrichment[x.raw.word_id] || {}).hanviet || '').trim();
const hanvietPool = () => learnedPool('ko', x => hanvietOf(x));

function sourcesList(lang) {
  const by = {};
  learnedPool(lang).forEach(x => {
    const u = x.raw['Nguồn (URL)'];
    if (!u) return;
    const s = by[u] || (by[u] = { url: u, title: x.raw['Tiêu đề trang'] || u, items: [], R: 9 });
    s.items.push(x); s.R = Math.min(s.R, x.R);
  });
  return Object.values(by).filter(s => s.items.length >= 2).sort((a, b) => a.R - b.R);
}

function practiceHub() {
  const langs = ['en', 'ko'].filter(l => learnedCards(l).length >= 3);
  if (!langs.length) return `<div class="card"><h3>Luyện thêm</h3><p class="muted">Học ít nhất 3 từ để mở phần này.</p></div>`;
  if (!langs.includes(practiceLang)) practiceLang = langs[0];
  const L = practiceLang, ai = !!cfg.geminiKey;
  const acts = [
    ['story', 'Truyện ngắn', 'AI viết truyện dùng các từ bạn vừa học', ai],
    ['passage', 'Đoạn gốc', 'Điền các từ đã lưu vào đoạn văn bạn từng đọc', sourcesList(L).length > 0],
    ['match', 'Ghép cặp', 'Nối từ với nghĩa, tính giờ', learnedCards(L).length >= 4],
    ['error', 'Tìm và sửa lỗi', 'AI viết câu dùng sai từ, bạn chọn cách sửa', ai],
    ['translate', 'Dịch ngược', 'Dịch câu tiếng Việt sang ' + LANG_NAME[L], ai && translatePool(L).length >= 2],
    ['diary', 'Nhật ký', 'Viết câu về chính bạn, được chèn tiếng Việt', ai],
    ['hanviet', 'Hán Việt', 'Ghép từ gốc Hán với âm Hán Việt', L === 'ko' && hanvietPool().length >= 3]
  ].filter(a => a[3]);
  return `<div class="card">
    <h3>Luyện thêm</h3>
    <p class="muted">Các cách ôn khác để gặp từ theo nhiều kiểu. Không tính vào lịch ôn.</p>
    ${langs.length > 1 ? `<div class="seg" style="margin-top:12px">${langs.map(l => `<button data-plang="${l}" class="${l === L ? 'on' : ''}">${l === 'en' ? 'Tiếng Anh' : 'Tiếng Hàn'}</button>`).join('')}</div>` : ''}
    <div class="acts">${acts.map(([k, n, desc]) => `<button class="act" data-act="${k}"><b>${n}</b><span>${desc}</span></button>`).join('')}</div>
    ${!ai ? '<p class="muted" style="margin-top:10px">Nhập Gemini API key (Cài đặt → Kết nối) để mở thêm các bài dùng AI.</p>' : ''}
  </div>`;
}

function startActivity(key, lang) {
  endAct();
  const map = {
    story: () => startStory(lang), passage: () => viewSources(lang), match: () => startMatch(lang),
    error: () => startError(lang), translate: () => startTranslate(lang), diary: () => startDiary(lang),
    hanviet: () => startHanviet(lang)
  };
  if (map[key]) map[key]();
}

/* ----- Ghép cặp tính giờ ----- */
function startMatch(lang) {
  const items = pickPractice(lang, 6, x => !!meaningOf(x));
  if (items.length < 4) { toast('Cần ít nhất 4 từ đã học để chơi.'); return; }
  endAct();
  act = { key: 'match', lang, items, left: shuffle(items.slice()), right: shuffle(items.slice()),
          done: new Set(), mistakes: {}, errors: 0, sel: null, t0: Date.now(), token: {} };
  drawMatch();
  act.timer = setInterval(() => {
    const el = document.getElementById('timer');
    if (el && act) el.textContent = fmtTime(Date.now() - act.t0);
  }, 500);
}
function drawMatch() {
  const a = act;
  render(actBar('Ghép cặp') + `
    <div class="card">
      <div class="row" style="align-items:center"><span class="muted">Chạm một từ, rồi chạm nghĩa của nó.</span><span class="pill accent" id="timer" style="flex:0 0 auto">0:00</span></div>
      <div class="match">
        <div class="col">${a.left.map(x => `<button class="mt" data-side="l" data-id="${x.raw.word_id}">${esc(x.raw['Từ vựng'])}</button>`).join('')}</div>
        <div class="col">${a.right.map(x => `<button class="mt" data-side="r" data-id="${x.raw.word_id}">${esc(meaningOf(x))}</button>`).join('')}</div>
      </div>
    </div>`);
  wireBack();
  app.querySelectorAll('.mt').forEach(b => b.onclick = () => onMatchTap(b));
}
function onMatchTap(b) {
  const a = act;
  if (!a || a.key !== 'match' || b.disabled) return;
  const side = b.dataset.side, id = b.dataset.id;
  if (a.sel && a.sel.side === side) { a.sel.el.classList.remove('on'); a.sel = null; }   // đổi lựa chọn trong cùng một cột
  if (!a.sel) { a.sel = { side, id, el: b }; b.classList.add('on'); return; }
  const first = a.sel;
  a.sel = null;
  first.el.classList.remove('on');
  if (first.id === id) {
    [first.el, b].forEach(x => { x.classList.add('right'); x.disabled = true; });
    a.done.add(id);
    if (a.done.size === a.items.length) finishMatch();
  } else {
    const leftId = first.side === 'l' ? first.id : id;
    a.mistakes[leftId] = (a.mistakes[leftId] || 0) + 1;
    a.errors++;
    [first.el, b].forEach(x => x.classList.add('wrong'));
    setTimeout(() => [first.el, b].forEach(x => x.classList.remove('wrong')), 450);
  }
}
function finishMatch() {
  const a = act;
  clearInterval(a.timer);
  const ms = Date.now() - a.t0;
  logPractice(a.items.map(x => {
    const m = a.mistakes[x.raw.word_id] || 0;
    return { word_id: x.raw.word_id, exercise: 'match', rating: m === 0 ? 3 : m === 1 ? 2 : 1, ms: Math.round(ms / a.items.length) };
  }));
  const wrong = a.items.filter(x => a.mistakes[x.raw.word_id]);
  actSummary('Ghép cặp', `Xong trong ${fmtTime(ms)}`,
    [a.errors ? `Nối nhầm ${a.errors} lần.` : 'Không nối nhầm lần nào.',
     ...(wrong.length ? ['Cần xem lại: ' + wrong.map(x => `<b>${esc(x.raw['Từ vựng'])}</b> (${esc(meaningOf(x))})`).join(', ')] : [])],
    () => startMatch(a.lang));
}

/* ----- Đoạn gốc: điền nhiều chỗ trống ----- */
function trimToSentence(s) {
  s = String(s || '').trim();
  const m = s.match(/^([\s\S]*[.!?。！？])[^.!?。！？]*$/);
  return m && m[1].length > s.length * 0.5 ? m[1].trim() : s;
}
const escRx = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

// Ghép các đoạn ngữ cảnh gốc của cùng một bài, rồi che mọi từ đã lưu (kể cả dạng chia như số nhiều).
function buildPassage(items) {
  const snippets = [];
  items.slice().sort((a, b) => new Date(a.raw['Thời gian']) - new Date(b.raw['Thời gian'])).forEach(x => {
    const t = trimToSentence(x.raw['Câu / Ngữ cảnh']);
    if (!t) return;
    const i = snippets.findIndex(s => s.includes(t) || t.includes(s));
    if (i > -1) { if (t.length > snippets[i].length) snippets[i] = t; return; }
    snippets.push(t);
  });
  const byWord = new Map(items.map(x => [norm(x.raw['Từ vựng']), x]));
  const words = [...byWord.values()].map(x => x.raw['Từ vựng']).sort((a, b) => b.length - a.length);
  const re = new RegExp('(?<![\\p{L}\\p{N}])(' + words.map(escRx).join('|') + ')[\\p{L}]*', 'giu');
  const blanks = [];
  const html = snippets.map(t => {
    let out = '', last = 0, m;
    re.lastIndex = 0;
    while ((m = re.exec(t))) {
      const it = byWord.get(norm(m[1]));
      if (!it) continue;
      out += esc(t.slice(last, m.index));
      out += `<input class="blank-in" data-i="${blanks.length}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="width:${Math.max(6, m[0].length + 2)}ch">`;
      blanks.push({ id: it.raw.word_id, surface: m[0], base: it.raw['Từ vựng'] });
      last = m.index + m[0].length;
    }
    return `<p>${out}${esc(t.slice(last))}</p>`;
  }).join('');
  return { html, blanks };
}
function gradeBlanks(blanks, values) {
  const per = {}, kinds = blanks.map((b, i) => {
    const r = checkAnswer(values[i] || '', [b.surface, b.base]);
    const k = r.exact ? 'ok' : (r.near ? 'near' : 'bad');
    (per[b.id] || (per[b.id] = { ok: 0, near: 0, bad: 0 }))[k]++;
    return k;
  });
  const rows = Object.entries(per).map(([id, c]) => ({ word_id: id, exercise: 'passage', rating: c.bad ? 1 : c.near ? 2 : 3 }));
  return { kinds, rows, ok: kinds.filter(k => k === 'ok').length };
}
function viewSources(lang) {
  const list = sourcesList(lang);
  if (!list.length) { toast('Chưa có bài nào có từ 2 từ đã học trở lên.'); return; }
  endAct();
  act = { key: 'sources', token: {} };
  render(actBar('Đoạn gốc') + `<div class="card"><p class="muted">Chọn một bài bạn đã đọc. App ghép lại đoạn văn gốc và che các từ bạn đã lưu trong bài.</p>
    ${list.map((s, i) => `<button class="choice" data-i="${i}">${esc(s.title.slice(0, 90))}<span class="muted"> · ${s.items.length} từ</span></button>`).join('')}</div>`);
  wireBack();
  app.querySelectorAll('.choice').forEach(b => b.onclick = once(() => startPassage(lang, list[+b.dataset.i])));
}
function startPassage(lang, src) {
  const built = buildPassage(src.items);
  if (built.blanks.length < 2) { toast('Đoạn văn này quá ngắn để làm bài.'); return; }
  endAct();
  act = { key: 'passage', token: {}, lang, src, built, blanks: built.blanks, focus: null, t0: Date.now() };
  drawPassage();
}
function drawPassage() {
  const a = act, bank = shuffle([...new Set(a.blanks.map(b => b.base))]);
  render(actBar('Đoạn gốc') + `<div class="card passage">
    <p class="muted"><a href="${esc(a.src.url)}" target="_blank" rel="noopener">${esc(a.src.title.slice(0, 80))}</a></p>
    ${a.built.html}
    <div class="pills" id="bank">${bank.map(w => `<button class="chip" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div>
    <div class="row" style="margin-top:14px"><button id="bankToggle">Ẩn gợi ý</button><button class="primary" id="check">Kiểm tra</button></div>
    <div id="res"></div></div>`);
  wireBack();
  const inputs = [...app.querySelectorAll('input.blank-in')];
  inputs.forEach(inp => { inp.onfocus = () => { a.focus = inp; }; });
  app.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    const target = (a.focus && !a.focus.value) ? a.focus : inputs.find(i => !i.value);
    if (target) { target.value = c.dataset.w; const next = inputs.find(i => !i.value); if (next) next.focus(); }
  });
  $('#bankToggle').onclick = () => { const b = $('#bank'); b.classList.toggle('hide'); $('#bankToggle').textContent = b.classList.contains('hide') ? 'Hiện gợi ý' : 'Ẩn gợi ý'; };
  $('#check').onclick = once(() => {
    const g = gradeBlanks(a.blanks, inputs.map(i => i.value));
    inputs.forEach((inp, i) => {
      inp.classList.add(g.kinds[i] === 'ok' ? 'right' : g.kinds[i] === 'near' ? 'near' : 'wrong');
      inp.disabled = true;
      if (g.kinds[i] !== 'ok') inp.insertAdjacentHTML('afterend', `<span class="fix">${esc(a.blanks[i].surface)}</span>`);
    });
    logPractice(g.rows);
    $('#check').disabled = true;
    $('#res').innerHTML = `<p class="verdict ${g.ok === a.blanks.length ? 'ok' : 'no'}">Đúng ${g.ok}/${a.blanks.length} chỗ trống.</p>
      <div class="row"><button class="primary" id="again">Chọn bài khác</button></div>`;
    $('#again').onclick = once(() => viewSources(a.lang));
  });
}

/* ----- Tìm và sửa lỗi: kho câu hỏi soạn sẵn -----
   AI soạn trước 5 câu trong MỘT request và cất vào máy. Mỗi lần làm, app lấy câu từ kho;
   còn 2 câu thì âm thầm soạn thêm 5 câu mới (từ khác, kiểu lỗi khác) để làm tiếp không phải chờ.
   Câu soạn sẵn chưa dùng được giữ lại cho lần sau, không bị bỏ phí. */
const ERROR_SCHEMA = itemsSchema({
  wrong_sentence: { type: 'STRING' }, wrong_part: { type: 'STRING' }, right_part: { type: 'STRING' },
  distractors: { type: 'ARRAY', items: { type: 'STRING' } }, explain_vi: { type: 'STRING' }, kind: { type: 'STRING' }
}, ['wrong_sentence', 'wrong_part', 'right_part', 'distractors', 'explain_vi']);
const ERR_PREFETCH = 5, ERR_LOW = 2;
const errKey = (k, lang) => `vocab.err${k}.${lang}`;
const readJSON = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v ?? d; } catch { return d; } };
const errFetching = {};

function errorPrompt(lang, items, avoidKinds = []) {
  const list = items.map((x, i) => `${i}. "${x.raw['Từ vựng']}" — nghĩa: ${meaningOf(x)}`).join('\n');
  return `Bạn tạo bài tập "tìm và sửa lỗi" cho một người Việt đang học ${LANG_NAME[lang]}.
Với MỖI từ dưới đây, viết MỘT câu ${LANG_NAME[lang]} ngắn (trình độ B1, đời thường) có dùng từ đó SAI theo đúng một kiểu lỗi người học hay mắc: sai cụm đi kèm hoặc giới từ, sai dạng từ, sai sắc thái hoặc ngữ cảnh, hoặc sai trật tự. Câu không được có lỗi nào khác.
Dùng nhiều kiểu lỗi khác nhau giữa các câu${avoidKinds.length ? `; ưu tiên tránh các kiểu vừa dùng gần đây: ${avoidKinds.join(', ')}` : ''}.
Danh sách (số đầu dòng là chỉ số i):
${list}

Trả JSON { items: [...] }, mỗi phần tử có:
- i, wrong_sentence (câu có lỗi), kind (kiểu lỗi: collocation | preposition | form | nuance | order).
- wrong_part: đoạn LIỀN MẠCH, chép NGUYÊN VĂN từ wrong_sentence, chứa chỗ sai (1–4 từ).
- right_part: đoạn thay thế wrong_part để câu đúng và tự nhiên.
- distractors: 3 đoạn thay thế khác trông hợp lý nhưng KHÔNG đúng trong câu này (không trùng right_part).
- explain_vi: 1–2 câu tiếng Việt giải thích vì sao câu gốc sai.`;
}
function normalizeErrorItem(it, items) {
  const x = items[+it.i] || (items.length === 1 ? items[0] : null);
  if (!x) return null;
  const ws = String(it.wrong_sentence || ''), wp = String(it.wrong_part || ''), rp = String(it.right_part || '');
  if (!ws || !wp || !rp || !ws.includes(wp) || norm(wp) === norm(rp)) return null;
  const dis = [...new Set((it.distractors || []).map(String).filter(s => s && norm(s) !== norm(rp) && norm(s) !== norm(wp)))].slice(0, 3);
  if (dis.length < 2) return null;
  return { x, ws, wp, rp, opts: shuffle([rp, ...dis]), explain: String(it.explain_vi || ''), kind: String(it.kind || '') };
}
// Câu trong kho còn dùng được (từ vẫn còn trong danh sách đã học).
function errBank(lang) {
  const ids = new Set(learnedCards(lang).map(x => x.raw.word_id));
  return readJSON(errKey('Bank', lang), []).filter(q => ids.has(q.word_id));
}
// Soạn thêm 5 câu (một request); ưu tiên từ sắp quên, tránh từ đang có trong kho và từ vừa làm.
function fetchErrors(lang) {
  if (errFetching[lang]) return errFetching[lang];
  const bank = errBank(lang), used = readJSON(errKey('Used', lang), []);
  const inBank = new Set(bank.map(q => q.word_id)), recent = new Set(used.slice(-10));
  let items = pickPractice(lang, ERR_PREFETCH, x => !!meaningOf(x) && !inBank.has(x.raw.word_id) && !recent.has(x.raw.word_id));
  if (items.length < 2) items = pickPractice(lang, ERR_PREFETCH, x => !!meaningOf(x) && !inBank.has(x.raw.word_id));
  if (!items.length) return Promise.resolve(0);
  const kinds = readJSON(errKey('Kinds', lang), []).slice(-6);
  errFetching[lang] = callGemini({ feature: 'error', wordId: items.map(x => x.raw.word_id).join(','),
    prompt: errorPrompt(lang, items, kinds), schema: ERROR_SCHEMA })
    .then(({ data }) => {
      const seen = new Set();
      const fresh = (data.items || []).map(it => normalizeErrorItem(it, items))
        .filter(q => q && !seen.has(q.x.raw.word_id) && seen.add(q.x.raw.word_id))
        .map(q => ({ word_id: q.x.raw.word_id, ws: q.ws, wp: q.wp, rp: q.rp, dis: q.opts.filter(o => o !== q.rp), explain: q.explain, kind: q.kind }));
      localStorage.setItem(errKey('Bank', lang), JSON.stringify([...readJSON(errKey('Bank', lang), []), ...fresh].slice(-40)));
      return fresh.length;
    })
    .finally(() => { errFetching[lang] = null; });
  return errFetching[lang];
}

function startError(lang) {
  endAct();
  act = { key: 'error', token: {}, lang, n: 0, ok: 0, cur: null };
  return nextError();
}
async function nextError() {
  const a = act;
  if (!a || a.key !== 'error') return;
  let bank = errBank(a.lang);
  if (!bank.length) {
    actLoading('Tìm và sửa lỗi', 'AI đang soạn vài câu hỏi…');
    try { await fetchErrors(a.lang); }
    catch (e) { if (act === a) actError('Tìm và sửa lỗi', e.message, () => nextError()); return; }
    if (act !== a) return;                                   // đã thoát: câu vừa soạn vẫn nằm trong kho cho lần sau
    bank = errBank(a.lang);
    if (!bank.length) { actError('Tìm và sửa lỗi', 'AI chưa trả về câu hợp lệ, hãy thử lại.', () => nextError()); return; }
  }
  const s = bank[0];
  localStorage.setItem(errKey('Bank', a.lang), JSON.stringify(readJSON(errKey('Bank', a.lang), []).filter(q => !(q.word_id === s.word_id && q.ws === s.ws))));
  localStorage.setItem(errKey('Used', a.lang), JSON.stringify([...readJSON(errKey('Used', a.lang), []), s.word_id].slice(-30)));
  if (s.kind) localStorage.setItem(errKey('Kinds', a.lang), JSON.stringify([...readJSON(errKey('Kinds', a.lang), []), s.kind].slice(-12)));
  if (bank.length - 1 <= ERR_LOW) fetchErrors(a.lang).catch(err => console.warn('Soạn trước câu hỏi thất bại', err));   // chuẩn bị sẵn, không chờ
  const raw = rawById(s.word_id);
  a.cur = { x: { raw, card: cardOf(raw) }, ws: s.ws, wp: s.wp, rp: s.rp, opts: shuffle([s.rp, ...s.dis]), explain: s.explain };
  drawError();
}
function drawError() {
  const a = act, q = a.cur;
  a.t0 = Date.now();
  const html = esc(q.ws).replace(esc(q.wp), `<mark class="err">${esc(q.wp)}</mark>`);
  render(actBar('Tìm và sửa lỗi') + `
    <div class="card"><p class="muted">Câu ${a.n + 1}${a.n ? ` · đúng ${a.ok}/${a.n}` : ''} · từ cần ôn: <b>${esc(q.x.raw['Từ vựng'])}</b> (${esc(meaningOf(q.x))})</p>
      <p class="context">${html}</p>
      <p class="muted">Chỗ được tô màu đang dùng chưa đúng. Chọn cách sửa phù hợp nhất.</p>
      <div>${q.opts.map((o, i) => `<button class="choice" data-v="${esc(o)}"><span class="k">${i + 1}</span>${esc(o)}</button>`).join('')}</div>
      <div id="fb"></div></div>`);
  wireBack();
  app.querySelectorAll('.choice').forEach(b => b.onclick = once(() => answerError(b)));
}
function answerError(b) {
  const a = act, q = a.cur, ok = b.dataset.v === q.rp, ms = Date.now() - a.t0;
  app.querySelectorAll('.choice').forEach(x => { x.disabled = true; if (x.dataset.v === q.rp) x.classList.add('right'); });
  if (!ok) b.classList.add('wrong');
  a.n++; if (ok) a.ok++;
  logPractice([{ word_id: q.x.raw.word_id, exercise: 'error', rating: rateOf(ok, ms), ms }]);
  $('#fb').innerHTML = `<p class="verdict ${ok ? 'ok' : 'no'}">${ok ? 'Đúng.' : 'Chưa đúng.'}</p>
    <p class="context">${esc(q.ws.replace(q.wp, q.rp))}</p>${q.explain ? `<p class="muted">${esc(q.explain)}</p>` : ''}
    <div class="row" style="margin-top:12px"><button class="primary" id="next">Câu tiếp theo</button><button id="home2">Xong (đúng ${a.ok}/${a.n})</button></div>`;
  arm(500);
  $('#next').onclick = once(() => nextError());
  $('#home2').onclick = once(() => { endAct(); viewHome(); });
}

/* ----- Dịch ngược: từng câu một, chấm ngay khi bạn trả lời ----- */
const TRANSLATE_SCHEMA = itemsSchema({ score: { type: 'INTEGER' }, feedback_vi: { type: 'STRING' }, better: { type: 'STRING' } },
  ['score', 'feedback_vi', 'better']);
function localTranslateScore(text, ref, word) {
  const a = new Set(toksAny(text)), b = toksAny(ref);
  if (!a.size || !b.length) return 1;
  const overlap = b.filter(t => a.has(t)).length / b.length;
  const usesWord = norm(text).includes(norm(word));
  return !usesWord ? 1 : overlap >= 0.6 ? 3 : overlap >= 0.35 ? 2 : 1;
}
const toksAny = s => String(s || '').toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(Boolean);

function startTranslate(lang) {
  const items = pickPractice(lang, 5, x => examplePairs(DB.enrichment[x.raw.word_id] || {}).length > 0);
  if (items.length < 2) { toast('Cần ít nhất 2 từ có câu ví dụ kèm bản dịch.'); return; }
  endAct();
  const qs = items.map(x => { const p = examplePairs(DB.enrichment[x.raw.word_id]); return { x, ...p[Math.floor(Math.random() * p.length)] }; });
  act = { key: 'translate', token: {}, lang, qs, i: 0, sum: 0, ctrl: new AbortController() };
  drawTranslate();
}
function drawTranslate() {
  const a = act, q = a.qs[a.i];
  render(actBar('Dịch ngược') + `<div class="progress"><i style="width:${(a.i / a.qs.length) * 100}%"></i></div>
    <div class="card"><p class="muted">${a.i + 1}/${a.qs.length} · dịch sang ${LANG_NAME[a.lang]} và dùng từ <b>${esc(q.x.raw['Từ vựng'])}</b></p>
      <p class="context">${esc(q.vi)}</p>
      <textarea id="ans" autocapitalize="off"></textarea>
      <p class="muted kbdhint" style="margin-top:6px">Enter để chấm · Shift + Enter xuống dòng</p>
      <div class="row" style="margin-top:12px"><button class="primary" id="ok">Chấm</button></div>
      <div id="fb"></div></div>`);
  wireBack();
  $('#ans').focus();
  $('#ans').onkeydown = e => { if (enterOK(e) && !e.shiftKey) { e.preventDefault(); $('#ok').click(); } };
  a.t0 = Date.now();
  $('#ok').onclick = once(async () => {
    const text = $('#ans').value.trim();
    if (!text) return;
    $('#ok').disabled = true; $('#ok').textContent = 'Đang chấm…';
    let fb;
    try {
      const { data } = await callGemini({ feature: 'translate', wordId: q.x.raw.word_id, schema: TRANSLATE_SCHEMA, signal: a.ctrl.signal, prompt:
`Một người Việt dịch câu sau sang ${LANG_NAME[a.lang]} (chỉ số i = 0).
0. Câu tiếng Việt: "${q.vi}"
   Bản dịch mẫu (chỉ để tham khảo, không bắt buộc giống từng chữ): "${q.en}"
   Từ cần dùng: "${q.x.raw['Từ vựng']}"
   Bản dịch của người học: "${text}"
Trả JSON { items: [{ i: 0, score, feedback_vi, better }] }:
- score 0–3: 3 = đúng nghĩa, đúng ngữ pháp, tự nhiên và dùng đúng từ cần dùng; 2 = đúng ý nhưng có lỗi nhỏ hoặc chưa tự nhiên; 1 = hiểu sai một phần hoặc không dùng từ cần dùng; 0 = sai hẳn.
- feedback_vi: 1–2 câu ngắn, hữu ích.
- better: một câu hoàn chỉnh, tự nhiên nhất, có dùng từ cần dùng.` });
      const r = byIndex(data, 1).get(0);
      if (!r) throw new Error('AI không trả kết quả');
      fb = { score: clamp(+r.score || 0, 0, 3), feedback: r.feedback_vi, better: r.better || q.en };
    } catch (e) {
      if (e && e.aborted) return;
      fb = { score: localTranslateScore(text, q.en, q.x.raw['Từ vựng']), feedback: 'Không gọi được AI, app chấm tạm bằng cách so khớp với câu mẫu.', better: q.en };
    }
    if (act !== a) return;
    a.sum += fb.score;
    logPractice([{ word_id: q.x.raw.word_id, exercise: 'translate', rating: [1, 2, 3, 4][fb.score], ms: Date.now() - a.t0 }]);
    $('#fb').innerHTML = `<p class="verdict ${fb.score >= 2 ? 'ok' : 'no'}">${esc(fb.feedback || '')}</p>
      <p class="ex-en">→ ${esc(fb.better)}</p>
      <div class="row" style="margin-top:12px"><button class="primary" id="next">${a.i + 1 < a.qs.length ? 'Câu tiếp theo' : 'Xem kết quả'}</button></div>`;
    arm(500);
    $('#next').onclick = once(() => {
      a.i++;
      if (a.i < a.qs.length) drawTranslate();
      else actSummary('Dịch ngược', `Điểm ${a.sum}/${a.qs.length * 3}`, [], () => startTranslate(a.lang));
    });
  });
}

/* ----- Nhật ký: viết từng câu, chấm ngay; được chèn tiếng Việt khi chưa biết từ ----- */
const DIARY_SCHEMA = itemsSchema({
  score: { type: 'INTEGER' }, feedback_vi: { type: 'STRING' }, corrected: { type: 'STRING' },
  vi_terms: { type: 'ARRAY', items: { type: 'OBJECT', properties: {
    vi: { type: 'STRING' }, en: { type: 'STRING' }, explain_vi: { type: 'STRING' }, example: { type: 'STRING' } },
    required: ['vi', 'en', 'explain_vi', 'example'] } }
}, ['score', 'feedback_vi', 'corrected', 'vi_terms']);

function startDiary(lang) {
  const items = pickPractice(lang, 3, x => !!meaningOf(x));
  if (items.length < 2) { toast('Cần ít nhất 2 từ đã học.'); return; }
  endAct();
  act = { key: 'diary', token: {}, lang, items, i: 0, ctrl: new AbortController() };
  drawDiary();
}
function drawDiary() {
  const a = act, x = a.items[a.i], L = LANG_NAME[a.lang];
  render(actBar('Nhật ký') + `<div class="progress"><i style="width:${(a.i / a.items.length) * 100}%"></i></div>
    <div class="card">
      <p class="muted">${a.i + 1}/${a.items.length} · Viết một câu về chính cuộc sống của bạn. Chỗ nào chưa biết nói bằng ${L}, cứ viết bằng tiếng Việt, AI sẽ dịch và giải thích kỹ từ đó.</p>
      <p class="q">${esc(x.raw['Từ vựng'])} <span class="muted">· ${esc(meaningOf(x))}</span></p>
      <textarea id="ans" autocapitalize="off" style="min-height:72px" placeholder="${a.lang === 'ko' ? 'Ví dụ: 오늘 저는 정말 háo hức 했어요.' : 'Ví dụ: Today I felt really háo hức about the trip.'}"></textarea>
      <p class="muted kbdhint" style="margin-top:6px">Enter để chấm · Shift + Enter xuống dòng</p>
      <div class="row" style="margin-top:12px"><button class="primary" id="ok">Chấm câu</button></div>
      <div id="fb"></div></div>`);
  wireBack();
  $('#ans').focus();
  $('#ans').onkeydown = e => { if (enterOK(e) && !e.shiftKey) { e.preventDefault(); $('#ok').click(); } };
  const t0 = Date.now();
  $('#ok').onclick = once(async () => {
    const text = $('#ans').value.trim();
    if (!text) return;
    $('#ok').disabled = true; $('#ok').textContent = 'Đang chấm…';
    try {
      const { data } = await callGemini({ feature: 'diary', wordId: x.raw.word_id, schema: DIARY_SCHEMA, signal: a.ctrl.signal, prompt:
`Một người Việt đang học ${L} viết nhật ký, dùng một từ cần ôn (chỉ số i = 0).
Họ ĐƯỢC PHÉP chèn từ hoặc cụm tiếng Việt vào câu khi chưa biết cách nói bằng ${L} (viết bồi). Đó là điều bình thường, không phải lỗi.
0. từ cần ôn "${x.raw['Từ vựng']}" (nghĩa: ${meaningOf(x)}) — câu của người học: "${text}"

Trả JSON { items: [{ i: 0, score, feedback_vi, corrected, vi_terms }] }:
- score 0–3: chấm phần dùng từ cần ôn (đúng nghĩa, đúng ngữ pháp, tự nhiên). KHÔNG trừ điểm chỉ vì có chèn tiếng Việt.
- corrected: câu hoàn chỉnh, tự nhiên, viết HOÀN TOÀN bằng ${L} (thay các phần tiếng Việt bằng cách nói tự nhiên nhất, đồng thời sửa lỗi khác nếu có).
- feedback_vi: 1–2 câu nhận xét ngắn, thẳng thắn, hữu ích về cách dùng từ cần ôn và ngữ pháp.
- vi_terms: với MỖI từ/cụm tiếng Việt người học đã chèn: { vi: đúng cụm tiếng Việt đó, en: cách nói ${L} phù hợp nhất trong câu này, explain_vi: giải thích kỹ (sắc thái, khi nào dùng, khác gì với các từ gần nghĩa, có cách nói nào khác), 2–3 câu, example: một câu ví dụ ${L} khác, ngắn, đời thường, dùng cách nói đó }. Không chèn tiếng Việt thì trả mảng rỗng.` });
      if (act !== a) return;
      const r = byIndex(data, 1).get(0);
      if (!r) throw new Error('AI không trả kết quả, hãy thử lại.');
      logPractice([{ word_id: x.raw.word_id, exercise: 'diary', rating: [1, 2, 3, 4][clamp(+r.score || 0, 0, 3)], ms: Date.now() - t0 }]);
      const terms = (r.vi_terms || []).filter(t => t && t.vi && t.en);
      $('#ok').textContent = 'Đã chấm';
      $('#fb').innerHTML = `<div class="diary-r">
          <p class="verdict ${r.score >= 2 ? 'ok' : 'no'}">${esc(r.feedback_vi)}</p>
          <p class="ex-en">→ ${esc(r.corrected)}</p>
          ${terms.length ? `<div class="vt">${terms.map(t => `
            <div class="vt-i"><div><span class="vt-vi">${esc(t.vi)}</span> → <b>${esc(t.en)}</b></div>
              <p>${esc(t.explain_vi)}</p>${t.example ? `<p class="vt-ex">${esc(t.example)}</p>` : ''}</div>`).join('')}</div>` : ''}
        </div>
        <div class="row" style="margin-top:14px"><button class="primary" id="next">${a.i + 1 < a.items.length ? 'Câu tiếp theo' : 'Viết với từ khác'}</button></div>`;
      arm(500);
      $('#next').onclick = once(() => { a.i++; if (a.i < a.items.length) drawDiary(); else startDiary(a.lang); });
    } catch (e) {
      if (e.aborted || act !== a) return;
      $('#ok').disabled = false; $('#ok').textContent = 'Chấm câu';
      toast('Không chấm được: ' + e.message, 3500);
    }
  });
}

/* ----- Hán Việt (tiếng Hàn) ----- */
function startHanviet(lang) {
  const pool = hanvietPool();
  const all = [...new Set(Object.values(DB.enrichment).filter(e => e.lang === 'ko' && e.hanviet).map(e => String(e.hanviet).trim()))];
  if (pool.length < 3 || all.length < 3) { toast('Cần ít nhất 3 từ tiếng Hàn gốc Hán đã học.'); return; }
  endAct();
  const items = shuffle(pool.slice(0, 16)).slice(0, 8);
  const qs = items.map(x => {
    const right = hanvietOf(x);
    return { x, right, opts: shuffle([right, ...shuffle(all.filter(v => v !== right)).slice(0, 3)]) };
  });
  act = { key: 'hanviet', token: {}, lang, qs, i: 0, ok: 0 };
  drawHanviet();
}
function drawHanviet() {
  const a = act, q = a.qs[a.i];
  a.t0 = Date.now();
  const e = DB.enrichment[q.x.raw.word_id] || {};
  render(actBar('Hán Việt') + `<div class="progress"><i style="width:${(a.i / a.qs.length) * 100}%"></i></div>
    <div class="card"><p class="muted">${a.i + 1}/${a.qs.length}</p>
      <div class="word">${esc(q.x.raw['Từ vựng'])}</div>
      ${e.romanization ? `<p class="muted">${esc(e.romanization)}</p>` : ''}
      <p class="muted">Âm Hán Việt của từ này là gì?</p>
      <div>${q.opts.map((o, i) => `<button class="choice" data-v="${esc(o)}"><span class="k">${i + 1}</span>${esc(o)}</button>`).join('')}</div>
      <div id="fb"></div></div>`);
  wireBack();
  app.querySelectorAll('.choice').forEach(b => b.onclick = once(() => {
    const ok = b.dataset.v === q.right, ms = Date.now() - a.t0;
    app.querySelectorAll('.choice').forEach(x => { x.disabled = true; if (x.dataset.v === q.right) x.classList.add('right'); });
    if (!ok) b.classList.add('wrong'); else a.ok++;
    logPractice([{ word_id: q.x.raw.word_id, exercise: 'hanviet', rating: rateOf(ok, ms), ms }]);
    speak(q.x.raw['Từ vựng'], 'ko');
    $('#fb').innerHTML = `<p class="verdict ${ok ? 'ok' : 'no'}">${ok ? 'Đúng.' : 'Chưa đúng.'} <b>${esc(q.x.raw['Từ vựng'])}</b> = ${esc(q.right)} · ${esc(meaningOf(q.x))}</p>
      <div class="row" style="margin-top:12px"><button class="primary" id="next">${a.i + 1 < a.qs.length ? 'Tiếp tục' : 'Xem kết quả'}</button></div>`;
    arm(500);
    $('#next').onclick = once(() => {
      a.i++;
      if (a.i < a.qs.length) drawHanviet();
      else actSummary('Hán Việt', `Đúng ${a.ok}/${a.qs.length} từ`, [], () => startHanviet(a.lang));
    });
  }));
}

/* ============================ TỰ CẬP NHẬT ============================ */
// Trình duyệt và app trên màn hình chính iPhone hay giữ bản cũ trong bộ nhớ đệm tới 10 phút hoặc lâu hơn.
// Hỏi thẳng máy chủ (bỏ qua bộ nhớ đệm); có bản mới hơn thì gửi nốt dữ liệu rồi tải lại.
let atHome = false;
async function checkUpdate() {
  if (location.protocol === 'file:') return;
  try {
    const res = await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' });
    const m = (await res.text()).match(/const APP_VERSION = '([^']+)'/);
    if (m && m[1] > APP_VERSION) {
      if (!atHome) { toast('Có bản mới, app sẽ cập nhật khi bạn về trang chủ.', 3000); return; }
      await flush(true);
      location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
    }
  } catch { /* mất mạng thì thôi */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });

/* ============================ KHỞI ĐỘNG ============================ */
async function boot() {
  migrateQueue();
  if (!cfg.apiUrl || !cfg.token) return viewSetup();
  render('<div class="card"><p class="muted">Đang tải dữ liệu…</p></div>');
  try {
    await loadAll();
    await flush(true);
    viewHome();
    checkUpdate();
  } catch (e) {
    viewSetup('Không tải được dữ liệu: ' + e.message + '. Kiểm tra lại địa chỉ và token, và nhớ deploy bản mới sau khi sửa Code.gs.');
  }
}
// Rời trang: gửi nốt bằng sendBeacon. Không xóa hàng đợi ở đây vì không biết chắc đã tới nơi;
// lần mở sau gửi lại cũng không sao vì server bỏ qua dòng trùng.
window.addEventListener('pagehide', () => {
  const q = queueRead();
  if (!q.length || !navigator.sendBeacon || flushing) return;
  const groups = {};
  q.forEach(x => (groups[x.action] ||= []).push(x.row));
  for (const [action, rows] of Object.entries(groups)) {
    const blob = new Blob([JSON.stringify({ token: cfg.token, action, rows })], { type: 'text/plain;charset=utf-8' });
    navigator.sendBeacon(cfg.apiUrl, blob);
  }
});
boot();
</script>
